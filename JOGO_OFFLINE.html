<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midnight Call</title>
<style>
/* The Midnight Call — casca da pagina.
   Tudo que e jogo acontece dentro do canvas. Aqui so existe o preto ao redor,
   o escalonamento e as duas telas de emergencia (boot e crash). */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Tahoma, Verdana, sans-serif;
  color: #7d7468;
}

#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

#game {
  display: block;
  /* O canvas e redimensionado por JS (gfx.resize). Estas regras garantem que
     o navegador nunca suavize os pixels na hora de mostrar. */
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  -ms-interpolation-mode: nearest-neighbor;
  background: #000;
}

body.playing { cursor: none; }

/* ---------- tela de boot ---------- */

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  z-index: 10;
  transition: opacity .6s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }

.boot-inner { text-align: center; }

.boot-title {
  font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
  font-size: 34px;
  letter-spacing: 6px;
  color: #5c5248;
  text-shadow: 0 0 18px rgba(150, 40, 30, .35);
  animation: bootpulse 3.4s ease-in-out infinite;
}

.boot-hint {
  margin-top: 14px;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #3d372f;
}

.boot-prev {
  margin-top: 22px;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #6e3229;
  cursor: pointer;
  text-decoration: underline;
}
.boot-prev:hover { color: #a63c2e; }

@keyframes bootpulse {
  0%, 100% { opacity: .55; }
  50%      { opacity: .95; }
}

/* ---------- tela de crash ---------- */

#crash {
  position: fixed;
  inset: 0;
  background: #0a0708;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

/* ATENCAO: sem esta regra a tela de erro fica visivel PARA SEMPRE.
   O atributo hidden do HTML so funciona por causa da regra [hidden]
   { display: none } do navegador — e o seletor de ID acima, com
   prioridade maior, cancela ela. O jogo roda normalmente atras da tela
   preta e parece que travou. Custou uma sessao inteira de caca ao bug. */
#crash[hidden] { display: none !important; }

.crash-inner { max-width: 780px; }

.crash-title {
  font-family: Impact, sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  color: #a63c2e;
  margin-bottom: 14px;
}

#crash-msg {
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #8b8177;
  background: #120e0f;
  border: 1px solid #241c1d;
  padding: 14px;
  max-height: 46vh;
  overflow: auto;
  white-space: pre-wrap;
  user-select: text;
}

.crash-actions {
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.crash-actions button {
  font-family: Tahoma, Verdana, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: #cfc6b8;
  background: #1a1416;
  border: 1px solid #3a2f2c;
  padding: 7px 14px;
  cursor: pointer;
}

.crash-actions button:hover {
  background: #2a2022;
  border-color: #a63c2e;
  color: #fff;
}

#crash-copied {
  font-size: 11px;
  letter-spacing: 2px;
  color: #7a9c6a;
}

.crash-hint {
  margin-top: 12px;
  font-size: 11px;
  letter-spacing: 1px;
  color: #4a423a;
}

</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>
  </div>

  <div id="boot">
    <div class="boot-inner">
      <p class="boot-title">THE MIDNIGHT CALL</p>
      <p class="boot-hint" id="boot-msg">carregando&#8230;</p>
      <p class="boot-prev" id="boot-prev" hidden>ver o ultimo erro</p>
    </div>
  </div>

  <div id="crash" hidden>
    <div class="crash-inner">
      <p class="crash-title">O jogo travou.</p>
      <pre id="crash-msg"></pre>
      <div class="crash-actions">
        <button id="crash-copy" type="button">COPIAR ERRO</button>
        <button id="crash-reload" type="button">RECARREGAR</button>
        <span id="crash-copied"></span>
      </div>
      <p class="crash-hint">Clique em COPIAR ERRO e cole no chat. E esse texto que diz o que quebrou.</p>
    </div>
  </div>

  <script>
    // Rede de seguranca. Um modulo que explode em silencio deixa a tela preta
    // e sem pista nenhuma; aqui o erro vira texto que o jogador copia com um
    // clique. Vale mais que qualquer descricao do que ele viu acontecer.
    (function () {
      var LS_KEY = 'tmc.lastError';

      function ambiente() {
        var g = window.game;
        var linhas = [
          'navegador: ' + navigator.userAgent,
          'tela: ' + window.innerWidth + 'x' + window.innerHeight +
            ' dpr' + (window.devicePixelRatio || 1),
          'url: ' + location.href,
        ];
        if (g) {
          linhas.push('estado: ' + g.state +
            '  fase: ' + (g.level ? g.level.key : '-') +
            '  fps: ' + (g.fps ? g.fps.toFixed(0) : '-'));
          if (g.player) {
            linhas.push('jogador: x=' + Math.round(g.player.x) +
              ' estado=' + g.player.state +
              ' anim=' + (g.player.det ? g.player.det.anim : '-'));
          }
          if (g.opening) linhas.push('cutscene: ' + g.opening.phase);
        } else {
          linhas.push('estado: o jogo nem chegou a carregar');
          var b = document.getElementById('boot-msg');
          if (b) linhas.push('boot parou em: "' + b.textContent + '"');
        }
        return linhas.join('\n');
      }

      function mostrar(titulo, detalhe) {
        var box = document.getElementById('crash');
        var msg = document.getElementById('crash-msg');
        if (!box || box.hidden === false) return;
        var texto = titulo + '\n\n' + detalhe + '\n\n--- ambiente ---\n' + ambiente();
        box.hidden = false;
        msg.textContent = texto;
        try { localStorage.setItem(LS_KEY, texto); } catch (e) { /* sem espaco */ }
      }

      window.__crash = mostrar;

      window.addEventListener('error', function (e) {
        mostrar(
          e.message || 'erro desconhecido',
          (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0) + '\n\n' +
          (e.error && e.error.stack ? e.error.stack : '(sem pilha)')
        );
      });

      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        mostrar('Promise rejeitada', (r && r.stack) ? r.stack : String(r));
      });

      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('crash-copy').addEventListener('click', function () {
          var t = document.getElementById('crash-msg').textContent;
          var aviso = document.getElementById('crash-copied');
          function ok() { aviso.textContent = 'copiado'; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(t).then(ok, fallback);
          } else fallback();
          function fallback() {
            var ta = document.createElement('textarea');
            ta.value = t; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); ok(); }
            catch (e) { aviso.textContent = 'selecione o texto e copie a mao'; }
            document.body.removeChild(ta);
          }
        });
        document.getElementById('crash-reload').addEventListener('click', function () {
          location.reload();
        });

        // O erro fica guardado. Se o jogador fechou a tela ou recarregou, o
        // texto nao se perde — ele reaparece a um clique na tela de abertura.
        var anterior = null;
        try { anterior = localStorage.getItem(LS_KEY); } catch (e) { /* sem acesso */ }
        if (anterior) {
          var link = document.getElementById('boot-prev');
          link.hidden = false;
          link.addEventListener('click', function () {
            var box = document.getElementById('crash');
            box.hidden = false;
            document.getElementById('crash-msg').textContent = anterior;
          });
        }

        // Vigia do carregamento. Um modulo que nao chega (servidor caiu no
        // meio, arquivo faltando) nao dispara erro nenhum: a tela fica
        // pulsando "carregando..." para sempre e nao ha nada para copiar.
        // Depois de 15 segundos isso vira um diagnostico de verdade.
        setTimeout(function () {
          var g = window.game;
          if (g && g.state && g.state !== 'boot') return;
          var passo = (document.getElementById('boot-msg') || {}).textContent || '?';
          var causa = g
            ? 'Os modulos carregaram, mas a construcao das fases nao terminou.\n' +
              'Parou no passo: "' + passo + '"'
            : 'Os modulos JavaScript nao carregaram.\n\n' +
              'Causa quase certa: a pagina foi aberta sem o servidor local, ou o\n' +
              'servidor caiu. Feche o navegador, feche todas as janelas pretas do\n' +
              'jogo e rode ABRIR_JOGO.bat de novo. O endereco tem que comecar com\n' +
              'http://localhost — se comecar com file:// o navegador bloqueia os\n' +
              'modulos e o jogo nunca sai daqui.';
          mostrar('O jogo nao terminou de carregar', causa);
        }, 15000);
      });
    })();
  </script>
<script>
(function(){
var __mods = {}, __cache = {};
function __req(id){
  if (__cache[id]) return __cache[id];
  var e = {}; __cache[id] = e;
  if (!__mods[id]) throw new Error("modulo ausente no pacote: " + id);
  __mods[id](e); return e;
}
__mods["core/gfx.js"] = function(__exp){
// gfx.js — o pipeline de imagem inteiro do jogo.
//
// Regra de ouro: TUDO e desenhado numa tela interna de 480x270. O navegador
// so amplia o resultado final, com nearest-neighbor, entao o pixel nunca
// borra. Nenhum modulo do jogo deve tocar no canvas visivel direto.
//
// Ordem de um frame:
//   gfx.begin()            limpa a cena
//   ... desenha mundo ...  em gfx.s (contexto 480x270)
//   gfx.beginLights(cor)   pinta o buffer de luz com a luz ambiente
//   ... gfx.addLight(...)  cada lampada/fogo/isqueiro soma luz
//   gfx.endLights()        multiplica luz sobre a cena + bloom
//   ... desenha UI ...     UI vem DEPOIS da luz, senao o menu fica escuro
//   gfx.present(dt)        grao, vinheta, scanline, fade, letterbox, shake

const VW = 480;
const VH = 270;

function makeBuffer(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { alpha: true });
  x.imageSmoothingEnabled = false;
  return { c, x };
}

// Ruido determinístico: mesma semente, mesmo resultado. Serve para grao,
// tijolo, ferrugem — coisas que precisam parecer aleatorias mas identicas
// a cada carregamento (senao o cenario "pisca" quando e reconstruido).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;

class Gfx {
  constructor() {
    this.scale = 1;
    this.shakeAmt = 0;
    this.shakeTime = 0;
    this.fade = 0;            // 0 = nada, 1 = preto total
    this.fadeColor = '#000000';
    this.flash = 0;
    this.flashColor = '#ffffff';
    this.letterbox = 0;       // 0..1 — altura das barras de cinema
    this.eyelid = 1;          // 1 = olhos abertos, 0 = fechados
    // Grao discreto de proposito. Acima de ~0.03 o ruido comeca a comer os
    // pixels do rosto do personagem, que tem 14px de largura — o que sobra
    // e uma cara suja e sem expressao.
    this.grainAmount = 0.018;
    this.scanlines = 0.07;
    this.vignetteAmount = 0.9;
    this.pixelPerfect = false;
    this.time = 0;
  }

  init() {
    this.out = document.getElementById('game');
    this.o = this.out.getContext('2d', { alpha: false });
    this.o.imageSmoothingEnabled = false;

    const scene = makeBuffer(VW, VH);
    this.sceneC = scene.c; this.s = scene.x;

    const light = makeBuffer(VW, VH);
    this.lightC = light.c; this.l = light.x;

    // Buffer de brilho em 1/4 da resolucao. Ampliar ele DE VOLTA com
    // suavizacao ligada e um blur gaussiano de pobre — e o que faz o poste
    // de luz ter halo em vez de borda dura.
    const glow = makeBuffer(VW >> 2, VH >> 2);
    this.glowC = glow.c; this.g = glow.x;
    this.g.imageSmoothingEnabled = true;

    const tmp = makeBuffer(VW, VH);
    this.tmpC = tmp.c; this.t = tmp.x;

    const tmp2 = makeBuffer(VW, VH);
    this.tmp2C = tmp2.c; this.t2 = tmp2.x;

    this._buildGrain();
    this._buildVignette();
    this._buildScanlines();

    this.resize();
    window.addEventListener('resize', () => this.resize());
    return this;
  }

  _buildGrain() {
    this.grain = [];
    const rnd = mulberry32(0xC0FFEE);
    for (let i = 0; i < 6; i++) {
      const b = makeBuffer(VW, VH);
      const img = b.x.createImageData(VW, VH);
      const d = img.data;
      for (let p = 0; p < d.length; p += 4) {
        const v = (rnd() * 255) | 0;
        d[p] = v; d[p + 1] = v; d[p + 2] = v; d[p + 3] = 255;
      }
      b.x.putImageData(img, 0, 0);
      this.grain.push(b.c);
    }
    this.grainIdx = 0;
    this.grainTimer = 0;
  }

  _buildVignette() {
    const b = makeBuffer(VW, VH);
    const g = b.x.createRadialGradient(VW / 2, VH / 2, VH * 0.28, VW / 2, VH / 2, VH * 0.86);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.55, 'rgba(206,200,196,1)');
    g.addColorStop(1, 'rgba(56,50,54,1)');
    b.x.fillStyle = g;
    b.x.fillRect(0, 0, VW, VH);
    this.vignetteC = b.c;
  }

  _buildScanlines() {
    const b = makeBuffer(4, 4);
    b.x.fillStyle = 'rgba(255,255,255,1)';
    b.x.fillRect(0, 0, 4, 4);
    b.x.fillStyle = 'rgba(120,120,130,1)';
    b.x.fillRect(0, 1, 4, 1);
    this.scanC = b.c;
    this.scanPattern = this.t.createPattern(b.c, 'repeat');
  }

  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    let sc = Math.min(w / VW, h / VH);
    if (this.pixelPerfect) sc = Math.max(1, Math.floor(sc));
    this.scale = sc;
    this.out.style.width = Math.round(VW * sc) + 'px';
    this.out.style.height = Math.round(VH * sc) + 'px';
  }

  shake(amount, dur = 0.35) {
    this.shakeAmt = Math.max(this.shakeAmt, amount);
    this.shakeTime = Math.max(this.shakeTime, dur);
    this.shakeDur = this.shakeTime;
  }

  begin(clearColor) {
    const s = this.s;
    this.protect = null;          // cada estado decide de novo o que poupar
    s.setTransform(1, 0, 0, 1, 0, 0);
    s.globalCompositeOperation = 'source-over';
    s.globalAlpha = 1;
    if (clearColor) { s.fillStyle = clearColor; s.fillRect(0, 0, VW, VH); }
    else s.clearRect(0, 0, VW, VH);
  }

  // ---------- luz ----------

  beginLights(ambient) {
    const l = this.l, g = this.g;
    l.setTransform(1, 0, 0, 1, 0, 0);
    l.globalCompositeOperation = 'source-over';
    l.globalAlpha = 1;
    l.fillStyle = ambient;
    l.fillRect(0, 0, VW, VH);
    l.globalCompositeOperation = 'lighter';

    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    g.clearRect(0, 0, VW >> 2, VH >> 2);
    g.globalCompositeOperation = 'lighter';
  }

  // Luz redonda. `falloff` < 1 concentra o miolo, > 1 espalha.
  addLight(x, y, r, color, intensity = 1, falloff = 1) {
    if (r <= 0 || intensity <= 0) return;
    if (x + r < 0 || x - r > VW || y + r < 0 || y - r > VH) return;
    const l = this.l;
    const grad = l.createRadialGradient(x, y, 0, x, y, r);
    const rgb = hexToRgb(color);
    const mid = clamp(0.42 * falloff, 0.05, 0.9);
    grad.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity})`);
    grad.addColorStop(mid, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity * 0.42})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    l.fillStyle = grad;
    l.fillRect(x - r, y - r, r * 2, r * 2);

    const g = this.g, q = 0.25;
    const gx = x * q, gy = y * q, gr = r * q;
    const grad2 = g.createRadialGradient(gx, gy, 0, gx, gy, gr);
    grad2.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity * 0.9})`);
    grad2.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad2;
    g.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
  }

  // Cone de luz — poste de rua, farol de carro, lanterna.
  addCone(x, y, angle, spread, len, color, intensity = 1) {
    const l = this.l;
    const rgb = hexToRgb(color);
    l.save();
    l.translate(x, y);
    l.rotate(angle);
    const grad = l.createLinearGradient(0, 0, len, 0);
    grad.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity})`);
    grad.addColorStop(0.45, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity * 0.45})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    l.fillStyle = grad;
    l.beginPath();
    l.moveTo(0, 0);
    l.lineTo(len, -Math.tan(spread / 2) * len);
    l.lineTo(len, Math.tan(spread / 2) * len);
    l.closePath();
    l.fill();
    l.restore();

    const g = this.g, q = 0.25;
    g.save();
    g.translate(x * q, y * q);
    g.rotate(angle);
    const grad2 = g.createLinearGradient(0, 0, len * q, 0);
    grad2.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity * 0.7})`);
    grad2.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad2;
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(len * q, -Math.tan(spread / 2) * len * q);
    g.lineTo(len * q, Math.tan(spread / 2) * len * q);
    g.closePath();
    g.fill();
    g.restore();
  }

  endLights(bloom = 0.5) {
    const s = this.s;
    s.globalCompositeOperation = 'multiply';
    s.globalAlpha = 1;
    s.drawImage(this.lightC, 0, 0);

    if (bloom > 0) {
      s.globalCompositeOperation = 'lighter';
      s.globalAlpha = bloom;
      s.imageSmoothingEnabled = true;
      s.drawImage(this.glowC, 0, 0, VW, VH);
      s.imageSmoothingEnabled = false;
      s.globalAlpha = 1;
    }
    s.globalCompositeOperation = 'source-over';
  }

  // ---------- pos-processamento e apresentacao ----------

  // Aplica um efeito de tela cheia poupando o retangulo `protect` — que e
  // onde o personagem esta. Grao e scanline em cima de um rosto de 14px
  // comem os pixels que desenham o olho e a boca, e ele fica com cara de
  // borrao. Fora dele o efeito vale inteiro; em cima dele, um quarto.
  _post(modo, alpha, desenha) {
    const s = this.s, p = this.protect;
    if (!p) {
      s.save();
      s.globalCompositeOperation = modo;
      s.globalAlpha = alpha;
      desenha(s);
      s.restore();
      return;
    }
    s.save();
    s.beginPath();
    s.rect(0, 0, VW, VH);
    s.rect(p.x, p.y, p.w, p.h);
    s.clip('evenodd');            // tudo menos o personagem
    s.globalCompositeOperation = modo;
    s.globalAlpha = alpha;
    desenha(s);
    s.restore();

    s.save();
    s.beginPath();
    s.rect(p.x, p.y, p.w, p.h);
    s.clip();
    s.globalCompositeOperation = modo;
    s.globalAlpha = alpha * 0.25;
    desenha(s);
    s.restore();
  }

  present(dt) {
    this.time += dt;
    const s = this.s, o = this.o;
    s.setTransform(1, 0, 0, 1, 0, 0);
    s.globalCompositeOperation = 'source-over';
    s.globalAlpha = 1;

    if (this.vignetteAmount > 0) {
      s.globalCompositeOperation = 'multiply';
      s.globalAlpha = this.vignetteAmount;
      s.drawImage(this.vignetteC, 0, 0);
      s.globalAlpha = 1;
      s.globalCompositeOperation = 'source-over';
    }

    if (this.grainAmount > 0) {
      this.grainTimer += dt;
      if (this.grainTimer > 1 / 18) { this.grainTimer = 0; this.grainIdx = (this.grainIdx + 1) % this.grain.length; }
      const img = this.grain[this.grainIdx];
      this._post('overlay', this.grainAmount, (c) => c.drawImage(img, 0, 0));
    }

    this._env(soco, t, 0.001, 0.2, 0.55 * vol);
    soco.start(t); soco.stop(t + 0.25);

    // cauda batendo nas paredes
    const cauda = c.createBufferSource();
    cauda.buffer = this.noiseBuf;
    cauda.playbackRate.value = 0.8;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.value = 900;
    cauda.connect(bp);
    const g2 = this._env(bp, t + 0.04, 0.05, 0.9, 0.16 * vol);
    g2.connect(this.verb);
    cauda.start(t + 0.04, Math.random() * 2, 1.2); cauda.stop(t + 1.2);
  }

  dryClick() {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 9; f.frequency.value = 2600;
    s.connect(f);
    this._env(f, t, 0.001, 0.035, 0.20);
    s.start(t, Math.random() * 3, 0.06); s.stop(t + 0.08);
  }

  // couro e metal: sacar, guardar, recarregar
  leather(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.9;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(500, t);
    f.frequency.exponentialRampToValueAtTime(1500, t + 0.14);
    s.connect(f);
    this._env(f, t, 0.006, 0.16, 0.13 * vol);
    s.start(t, Math.random() * 3, 0.3); s.stop(t + 0.3);
  }

  reloadClick(pitch = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 12; f.frequency.value = 1800 * pitch;
    s.connect(f);
    this._env(f, t, 0.001, 0.05, 0.16);
    s.start(t, Math.random() * 3, 0.08); s.stop(t + 0.1);
  }

  // ---------------- tensao ----------------
  // Duas serras desafinadas uma contra a outra (o batimento entre elas e o
  // que incomoda), um sopro agudo por cima e um filtro que vai abrindo.
  // Tudo controlado por um numero so: 0 = longe, 1 = em cima de voce.

  startDread() {
    if (!this.ensure()) return;
    if (this.dread) return;
    const c = this.ctx, t = c.currentTime;

    const saida = c.createGain();
    saida.gain.setValueAtTime(0.0001, t);
    saida.connect(this.busMusic);

    const filtro = c.createBiquadFilter();
    filtro.type = 'lowpass';
    filtro.frequency.setValueAtTime(240, t);
    filtro.Q.value = 3;
    filtro.connect(saida);

    const a = c.createOscillator(); a.type = 'sawtooth'; a.frequency.value = 41.2;
    const b = c.createOscillator(); b.type = 'sawtooth'; b.frequency.value = 42.1;
    const ga = c.createGain(); ga.gain.value = 0.5;
    a.connect(ga); b.connect(ga); ga.connect(filtro);
    a.start(t); b.start(t);

    // sopro agudo, quase inaudivel no comeco
    const ar = c.createBufferSource();
    ar.buffer = this.noiseBuf; ar.loop = true; ar.playbackRate.value = 1.4;
    const af = c.createBiquadFilter();
    af.type = 'bandpass'; af.Q.value = 2.2; af.frequency.value = 3200;
    const ag = c.createGain(); ag.gain.value = 0.0;
    ar.connect(af); af.connect(ag); ag.connect(saida);
    ar.start(t);

    this.dread = { saida, filtro, a, b, ar, ag };
    this.setDread(0);
  }

  setDread(k) {
    const d = this.dread;
    if (!d || !this.ready) return;
    const t = this.ctx.currentTime, r = 0.25;
    const ramp = (p, v) => {
      p.cancelScheduledValues(t); p.setValueAtTime(p.value, t);
      p.linearRampToValueAtTime(Math.max(0.0001, v), t + r);
    };
    ramp(d.saida.gain, 0.05 + k * 0.42);
    ramp(d.filtro.frequency, 240 + k * k * 1500);
    ramp(d.ag.gain, k * k * 0.05);
    // as duas serras se afastam: quanto mais perto, mais aspero o batimento
    ramp(d.b.frequency, 42.1 + k * 3.4);
  }

  // corte seco: e o silencio subito que da o susto, nao o barulho
  stopDread(fade = 0) {
    const d = this.dread;
    if (!d) return;
    const t = this.ctx.currentTime;
    d.saida.gain.cancelScheduledValues(t);
    d.saida.gain.setValueAtTime(d.saida.gain.value, t);
    d.saida.gain.linearRampToValueAtTime(0.0001, t + Math.max(0.008, fade));
    const stop = t + Math.max(0.02, fade) + 0.05;
    try { d.a.stop(stop); d.b.stop(stop); d.ar.stop(stop); } catch (e) {}
    this.dread = null;
  }

  heartbeat(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    for (let i = 0; i < 2; i++) {
      const o = c.createOscillator();
      o.type = 'sine';
      const t0 = t + i * 0.17;
      o.frequency.setValueAtTime(64, t0);
      o.frequency.exponentialRampToValueAtTime(30, t0 + 0.14);
      this._env(o, t0, 0.006, 0.16, (i ? 0.28 : 0.42) * vol, this.busMusic);
      o.start(t0); o.stop(t0 + 0.24);
    }
  }

  // pancada surda na nuca
  thud(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(28, t + 0.22);
    const g = this._env(o, t, 0.001, 0.34, 0.8 * vol);
    g.connect(this.verb);
    o.start(t); o.stop(t + 0.45);
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 700;
    s.connect(f);
    this._env(f, t, 0.001, 0.16, 0.5 * vol);
    s.start(t, Math.random() * 3, 0.3); s.stop(t + 0.3);
  }

  // zumbido de ouvido depois da pancada
  tinnitus(dur = 3) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine'; o.frequency.value = 3100;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.045, t + 0.15);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.2);
  }

  // ---------------- sons pontuais de ambiente ----------------
  // Sao estes, e nao um loop, que dizem em que lugar voce esta: uma gota
  // que cai a cada oito segundos num galpao vazio conta mais do que
  // qualquer textura de fundo.

  drip(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(900 + Math.random() * 500, t);
    o.frequency.exponentialRampToValueAtTime(260, t + 0.09);
    const g = this._env(o, t, 0.001, 0.12, 0.12 * vol);
    g.connect(this.verb);
    o.start(t); o.stop(t + 0.2);
  }

  metalCreak(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.3;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 22;
    const base = 300 + Math.random() * 500;
    f.frequency.setValueAtTime(base, t);
    f.frequency.linearRampToValueAtTime(base * 1.5, t + 0.9);
    f.frequency.linearRampToValueAtTime(base * 1.2, t + 1.8);
    s.connect(f);
    const g = this._env(f, t, 0.3, 1.6, 0.10 * vol);
    g.connect(this.verb);
    s.start(t, Math.random() * 2, 2.2); s.stop(t + 2.2);
  }

  chainRattle(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    for (let i = 0; i < 5; i++) {
      const s = c.createBufferSource();
      s.buffer = this.noiseBuf;
      const f = c.createBiquadFilter();
      f.type = 'bandpass'; f.Q.value = 16;
      f.frequency.value = 2200 + Math.random() * 1800;
      s.connect(f);
      const g = this._env(f, t + i * 0.045 * (0.6 + Math.random()), 0.001, 0.05, 0.07 * vol);
      g.connect(this.verb);
      s.start(t + i * 0.05, Math.random() * 3, 0.1); s.stop(t + i * 0.05 + 0.12);
    }
  }

  // longe, do lado de fora, alguem fechando alguma coisa pesada
  distantThump(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 0.3);
    const g = this._env(o, t, 0.01, 0.4, 0.16 * vol);
    g.connect(this.verb);
    o.start(t); o.stop(t + 0.5);
  }

  // cano velho arrebentando: metal cedendo e depois agua com pressao
  pipeBurst(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 8;
    f.frequency.setValueAtTime(1600, t);
    f.frequency.exponentialRampToValueAtTime(420, t + 0.25);
    s.connect(f);
    const g = this._env(f, t, 0.002, 0.3, 0.4 * vol);
    g.connect(this.verb);
    s.start(t, Math.random() * 3, 0.5); s.stop(t + 0.5);
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(50, t + 0.2);
    this._env(o, t, 0.001, 0.25, 0.4 * vol);
    o.start(t); o.stop(t + 0.35);
    // jato de agua depois
    const j = c.createBufferSource();
    j.buffer = this.noiseBuf;
    const jf = c.createBiquadFilter();
    jf.type = 'highpass'; jf.frequency.value = 2200;
    j.connect(jf);
    this._env(jf, t + 0.1, 0.15, 1.4, 0.13 * vol);
    j.start(t + 0.1, Math.random() * 2, 1.8); j.stop(t + 1.8);
  }

  // esforco: puxar, forcar, arrebentar
  strain(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.35;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 12;
    f.frequency.setValueAtTime(420 + Math.random() * 200, t);
    f.frequency.linearRampToValueAtTime(700, t + 0.3);
    s.connect(f);
    this._env(f, t, 0.03, 0.34, 0.13 * vol);
    s.start(t, Math.random() * 2, 0.5); s.stop(t + 0.5);
  }

  uiMove() {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(380, t + 0.06);
    this._env(o, t, 0.002, 0.07, 0.10);
    o.start(t); o.stop(t + 0.1);
  }

  uiConfirm() {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(300, t);
    o.frequency.exponentialRampToValueAtTime(600, t + 0.1);
    const g = this._env(o, t, 0.004, 0.24, 0.13);
    g.connect(this.verb);
    o.start(t); o.stop(t + 0.3);
  }

  uiBack() {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(420, t);
    o.frequency.exponentialRampToValueAtTime(190, t + 0.13);
    this._env(o, t, 0.004, 0.16, 0.11);
    o.start(t); o.stop(t + 0.2);
  }

  blip(pitch = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'square';
    o.frequency.value = 780 * pitch;
    this._env(o, t, 0.001, 0.022, 0.028);
    o.start(t); o.stop(t + 0.04);
  }

  // ---------------- ambientes em loop ----------------

  startLoop(name, opt) {
    if (!this.ensure()) return;
    if (this.loops[name]) return;
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource();
    src.buffer = this.noiseBuf;
    src.loop = true;
    const f = c.createBiquadFilter();
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(opt.gain, t + (opt.fade || 1.5));

    if (name === 'hall') {
      // ar parado de galpao: grave largo, sem chuva nenhuma
      src.playbackRate.value = 0.18;
      f.type = 'lowpass'; f.frequency.value = 150;
      src.connect(f); f.connect(g);
    } else if (name === 'rain') {
      src.playbackRate.value = 1.7;
      f.type = 'highpass'; f.frequency.value = 950;
      const f2 = c.createBiquadFilter();
      f2.type = 'lowpass'; f2.frequency.value = 6200;
      src.connect(f); f.connect(f2); f2.connect(g);
    } else if (name === 'roomtone') {
      src.playbackRate.value = 0.25;
      f.type = 'lowpass'; f.frequency.value = 220;
      src.connect(f); f.connect(g);
    } else if (name === 'wind') {
      src.playbackRate.value = 0.5;
      f.type = 'bandpass'; f.Q.value = 0.7; f.frequency.value = 480;
      src.connect(f); f.connect(g);
      // LFO deixa o vento respirando em vez de zumbido plano
      const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.08;
      const lg = c.createGain(); lg.gain.value = 260;
      lfo.connect(lg); lg.connect(f.frequency); lfo.start(t);
      this.loops[name + '_lfo'] = { src: lfo, gain: lg };
    } else {
      src.connect(f); f.connect(g);
    }

    g.connect(this.master);
    src.start(t, Math.random() * 2);
    this.loops[name] = { src, gain: g, filter: f };
  }

  stopLoop(name, fade = 1.2) {
    const L = this.loops[name];
    if (!L) return;
    const t = this.ctx.currentTime;
    L.gain.gain.cancelScheduledValues(t);
    L.gain.gain.setValueAtTime(L.gain.gain.value, t);
    L.gain.gain.linearRampToValueAtTime(0.0001, t + fade);
    try { L.src.stop(t + fade + 0.1); } catch (e) { /* ja parou */ }
    delete this.loops[name];
    const lfo = this.loops[name + '_lfo'];
    if (lfo) { try { lfo.src.stop(t + fade + 0.1); } catch (e) {} delete this.loops[name + '_lfo']; }
  }

  setLoopGain(name, v, ramp = 0.6) {
    const L = this.loops[name];
    if (!L) return;
    const t = this.ctx.currentTime;
    L.gain.gain.cancelScheduledValues(t);
    L.gain.gain.setValueAtTime(L.gain.gain.value, t);
    L.gain.gain.linearRampToValueAtTime(Math.max(0.0001, v), t + ramp);
  }

  stopAllLoops() {
    for (const k of Object.keys(this.loops)) this.stopLoop(k, 0.5);
  }

  // ---------------- musica ----------------
  // Re menor, ~46 bpm. Piano sintetico (triangulo + seno) com cauda longa
  // no reverb, mais um bordao grave. Melancolia com quatro notas.

  startMusic(mood = 'menu') {
    if (!this.ensure()) return;
    if (this.musicOn) return;
    this.musicOn = true;
    this.mood = mood;
    this._step = 0;
    this._nextNote = this.ctx.currentTime + 0.2;

    const c = this.ctx, t = c.currentTime;
    // bordao
    const dr = c.createOscillator(); dr.type = 'sine'; dr.frequency.value = 73.42; // Re2
    const dg = c.createGain(); dg.gain.setValueAtTime(0.0001, t);
    dg.gain.linearRampToValueAtTime(0.055, t + 4);
    dr.connect(dg); dg.connect(this.busMusic); dr.start(t);
    this.drone = { osc: dr, gain: dg };

    // chiado de vinil
    const vs = c.createBufferSource(); vs.buffer = this.noiseBuf; vs.loop = true;
    vs.playbackRate.value = 1.2;
    const vf = c.createBiquadFilter(); vf.type = 'highpass'; vf.frequency.value = 2600;
    const vg = c.createGain(); vg.gain.setValueAtTime(0.0001, t);
    vg.gain.linearRampToValueAtTime(0.017, t + 3);
    vs.connect(vf); vf.connect(vg); vg.connect(this.busMusic); vs.start(t);
    this.vinyl = { src: vs, gain: vg };
  }

  stopMusic(fade = 2.0) {
    if (!this.musicOn) return;
    this.musicOn = false;
    const t = this.ctx.currentTime;
    for (const n of [this.drone, this.vinyl]) {
      if (!n) continue;
      n.gain.gain.cancelScheduledValues(t);
      n.gain.gain.setValueAtTime(n.gain.gain.value, t);
      n.gain.gain.linearRampToValueAtTime(0.0001, t + fade);
      try { (n.osc || n.src).stop(t + fade + 0.2); } catch (e) {}
    }
    this.drone = null; this.vinyl = null;
  }

  // Melodia agendada com antecedencia — WebAudio nao gosta de ser
  // alimentado no ritmo do requestAnimationFrame.
  updateMusic() {
    if (!this.musicOn || !this.ready) return;
    const c = this.ctx;
    const MEL = [
      [293.66, 2.4], [349.23, 1.6], [440.00, 2.8], [392.00, 1.6],
      [349.23, 2.4], [329.63, 3.2], [293.66, 3.6], [0, 2.4],
      [440.00, 2.0], [466.16, 2.4], [392.00, 3.0], [349.23, 2.0],
      [293.66, 4.4], [0, 3.0],
    ];
    while (this._nextNote < c.currentTime + 1.5) {
      const [freq, dur] = MEL[this._step % MEL.length];
      if (freq > 0) this._piano(freq, this._nextNote, dur);
      this._nextNote += dur;
      this._step++;
    }
  }

  _piano(freq, t, dur) {
    const c = this.ctx;
    const mk = (type, f, amp, decay) => {
      const o = c.createOscillator();
      o.type = type; o.frequency.value = f;
      const g = c.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(amp, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
      o.connect(g);
      g.connect(this.busMusic);
      g.connect(this.verb);
      o.start(t); o.stop(t + decay + 0.1);
    };
    const d = Math.min(dur * 1.6, 5);
    mk('triangle', freq, 0.075, d);
    mk('sine', freq * 2, 0.026, d * 0.55);
    mk('sine', freq * 0.5, 0.032, d * 0.8);
  }

  // ---------------- narracao gravada ----------------

  async findNarration() {
    // Aberto por file:// (versao JOGO_OFFLINE.html) o fetch e bloqueado
    // pelo navegador, mas um elemento <audio> ainda consegue carregar o
    // arquivo. Por isso existem dois caminhos aqui.
    const porArquivo = typeof location !== 'undefined' && location.protocol === 'file:';

    for (const url of CANDIDATE_NARRATION) {
      if (porArquivo) {
        const achou = await new Promise(resolve => {
          const el = new window.Audio();
          const limpar = () => { el.oncanplaythrough = el.onloadedmetadata = el.onerror = null; };
          const t = setTimeout(() => { limpar(); resolve(false); }, 2500);
          el.onloadedmetadata = () => { clearTimeout(t); limpar(); resolve(el.duration > 0.5); };
          el.onerror = () => { clearTimeout(t); limpar(); resolve(false); };
          el.preload = 'metadata';
          el.src = url;
        });
        if (achou) { this.narration = url; return url; }
      } else {
        try {
          const r = await fetch(url, { method: 'HEAD' });
          if (r.ok) { this.narration = url; return url; }
        } catch (e) { /* arquivo nao existe, segue */ }
      }
    }
    this.narration = null;
    return null;
  }

  // A voz vai pelo WebAudio para poder ser amplificada acima de 1.0. Um
  // limitador logo depois do ganho segura os picos: sem ele, +12 dB numa
  // fala que ja tem pico em -14 dBFS estouraria nos trechos mais altos.
  playNarration() {
    if (!this.narration) return null;
    const el = new window.Audio(this.narration);
    el.preload = 'auto';

    if (this.ensure()) {
      try {
        const src = this.ctx.createMediaElementSource(el);
        const ganho = this.ctx.createGain();
        ganho.gain.value = GANHO_VOZ;
        const lim = this.ctx.createDynamicsCompressor();
        lim.threshold.value = -6;
        lim.knee.value = 2;
        lim.ratio.value = 12;
        lim.attack.value = 0.003;
        lim.release.value = 0.18;
        src.connect(ganho); ganho.connect(lim); lim.connect(this.busVoice);
        this.narrChain = { src, ganho, lim };
        el.volume = 1;
      } catch (e) {
        // navegador recusou o roteamento: cai no volume simples do elemento
        this.narrChain = null;
        el.volume = Math.min(1, this.vol.master * this.vol.voice);
      }
    } else {
      el.volume = Math.min(1, this.vol.master * this.vol.voice);
    }

    el.play().catch(() => {});
    this.narrationEl = el;
    return el;
  }

    if (this.narrationEl) {

const ANIM_NAMES = Object.keys(ANIM);

// Interpolacao entre poses-chave.
//
// `ease: 'linear'` importa mais do que parece. Suavizar a entrada E a saida
// de CADA pose faz o membro desacelerar em todo quadro-chave, e o resultado
// e aquele balanco mole de boneco de pano. Andar, correr e socar usam
// interpolacao reta: o movimento tem direcao e para onde o animador mandou,
// nao onde a curva deixou. So parado e fumando usam curva suave.
function sampleAnim(anim, tn, out) {
  const keys = anim.keys;
  let i = 0;
  while (i < keys.length - 2 && keys[i + 1].t <= tn) i++;
  const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
  const span = Math.max(1e-6, b.t - a.t);
  let k = clamp((tn - a.t) / span, 0, 1);
  if (anim.ease !== 'linear') k = easeInOut(k);
  for (const f of FIELDS) out[f] = lerp(a.p[f], b.p[f], k);
  return out;
}

// ---------------------------------------------------------------------------
// o boneco
// ---------------------------------------------------------------------------

const BW = 120, BH = 120, ORX = 60, ORY = 100;

class Detective {
  constructor() {
    if (!P.head) buildParts();
    this.buf = makeBuffer(BW, BH);
    this.rimBuf = makeBuffer(BW, BH);
    this.anim = 'idle';
    this.time = 0;
    this.speed = 1;
    this.facing = 1;
    this.flipT = 1;          // 1 = estavel; cai para 0 no meio da virada
    this.pose = Object.assign({}, REST);
    this.blendFrom = null;
    this.blendT = 0;
    this.blendDur = 0.14;
    this.done = false;
    this.onEvent = null;
    this.props = { cig: 'none', lighter: 'none', flame: 0, gun: 'holstered' };
    // Mira: sobrescreve os angulos do braco da frente depois da animacao.
    // Nao da para keyframar isto — o angulo vem do mouse do jogador.
    this.aim = { on: false, angle: 0, recoil: 0 };
    this.muzzleT = 0;
    this._muzzleLocal = null;
    this.rimColor = '#7fa5d8';
    this.rimDX = -1; this.rimDY = -1;
    // 0.55 deixava um contorno azul em volta do corpo inteiro e ele parecia
    // vestido de neon. O contorno tem que sugerir a luz, nao desenhar o
    // personagem.
    this.rimAlpha = 0.30;
    this.reflect = 0;
    this.alpha = 1;
    this.skirt = 0;      // inclinacao da aba do sobretudo (segue o corpo com atraso)
    this._firedIdx = -1;
    this._lightLocal = null;
    this._cigWorld = null;
    this.visible = true;
    this.showSkeleton = false;
    // Silhueta: se tiver cor, o corpo inteiro e pintado com ela e a luz de
    // contorno some. E assim que a figura negra e feita — o mesmo boneco
    // articulado, sem nenhuma informacao dentro.
    this.silhouette = null;
    this.scaleX = 1;
    this.scaleY = 1;
  }

  play(name, opts = {}) {
    if (this.anim === name && !opts.restart) return;
    if (!ANIM[name]) return;
    this.blendFrom = Object.assign({}, this.pose);
    this.blendT = 0;
    this.blendDur = opts.blend === undefined ? 0.14 : opts.blend;
    this.anim = name;
    this.time = 0;
    this.done = false;
    this._firedIdx = -1;
    if (name !== 'smoke') this._clearProps();
  }

  _clearProps() {
    this.props.cig = 'none';
    this.props.lighter = 'none';
    this.props.flame = 0;
  }

  setFacing(f) {
    if (f === this.facing || f === 0) return;
    this.facing = f;
    this.flipT = 0;   // dispara o achatamento horizontal da virada
  }

  update(dt) {
    const a = ANIM[this.anim];
    if (!a) return;
    this.time += dt * this.speed;
    let tn;
    if (a.loop) {
      tn = (this.time % a.dur) / a.dur;
      // eventos ciclicos: detecta a volta do laco
      if (a.events) {
        const prev = ((this.time - dt * this.speed) % a.dur) / a.dur;
        for (const e of a.events) {
          const crossed = prev <= tn ? (e.t > prev && e.t <= tn)
                                     : (e.t > prev || e.t <= tn);
          if (crossed) this._fire(e.ev);
        }
      }
    } else {
      tn = clamp(this.time / a.dur, 0, 1);
      if (a.events) {
        for (let i = 0; i < a.events.length; i++) {
          if (i > this._firedIdx && tn >= a.events[i].t) {
            this._firedIdx = i;
            this._fire(a.events[i].ev);
          }
        }
      }
      if (this.time >= a.dur) this.done = true;
    }

    sampleAnim(a, tn, this.pose);

    // A mira entra DEPOIS da animacao e por cima dela: o corpo continua
    // respirando e andando, so o braco da frente obedece ao mouse.
    if (this.aim.on) {
      const ang = this.aim.angle;
      const kick = this.aim.recoil;
      this.pose.aFu = 90 + ang - kick * 16;
      this.pose.aFf = -7 - kick * 10;
      this.pose.aBu = 20;
      this.pose.aBf = -34;
      this.pose.torso = -4 - kick * 5;
      this.pose.head = clamp(ang * 0.32, -12, 14);
      this.pose.hx = -kick * 2;
    }
    if (this.aim.recoil > 0) this.aim.recoil = Math.max(0, this.aim.recoil - dt * 6);
    if (this.muzzleT > 0) this.muzzleT -= dt;

    if (this.blendFrom && this.blendT < this.blendDur) {
      this.blendT += dt;
      const k = clamp(this.blendT / this.blendDur, 0, 1);
      for (const f of FIELDS) this.pose[f] = lerp(this.blendFrom[f], this.pose[f], k);
      if (k >= 1) this.blendFrom = null;
    }

    // A aba do sobretudo persegue a inclinacao do corpo com atraso, e
    // balanca a cada passo. E o unico lugar do personagem onde "mole" e o
    // efeito certo: pano nao acompanha osso.
    const andando = this.anim === 'walk' || this.anim === 'run';
    const alvo = -this.pose.torso * 0.45
      + (andando ? Math.sin(this.time * (this.anim === 'run' ? 13 : 8)) * (this.anim === 'run' ? 6 : 3.4) : 0);
    this.skirt = lerp(this.skirt, alvo, 1 - Math.exp(-9 * dt));

    if (this.flipT < 1) this.flipT = Math.min(1, this.flipT + dt * 9);
    if (this.props.flame > 0 && this.props.flame < 1) this.props.flame = Math.min(1, this.props.flame + dt * 5);
  }

  _fire(ev) {
    // estado dos objetos na mao vive aqui; som e particula vao pro jogo
    if (ev === 'cig_grab') this.props.cig = 'hand';
    else if (ev === 'cig_mouth') this.props.cig = 'mouth';
    else if (ev === 'lighter_grab') this.props.lighter = 'hand';
    else if (ev === 'flame_on') this.props.flame = 0.01;
    else if (ev === 'flame_off') { this.props.flame = 0; this.props.lighter = 'none'; }
    else if (ev === 'cig_hand') this.props.cig = 'hand';
    else if (ev === 'cig_toss') this.props.cig = 'none';
    if (this.onEvent) this.onEvent(ev, this);
  }

  // Luzes que o personagem emite (isqueiro, cigarro aceso). Coordenadas
  // ja em mundo, dado o pe em (x,y).
  lights(x, y) {
    const out = [];
    if (this.muzzleT > 0 && this._muzzleLocal) {
      const mx = x + (this._muzzleLocal.x - ORX) * this.facing;
      const my = y + (this._muzzleLocal.y - ORY);
      out.push({ x: mx, y: my, r: 104, color: '#ffd08a', i: 0.95 });
      out.push({ x: mx, y: my, r: 26, color: '#fff4d8', i: 1.1 });
    }
    if (this.props.flame > 0 && this._lightLocal) {
      const fx = x + (this._lightLocal.x - ORX) * this.facing;
      const fy = y + (this._lightLocal.y - ORY);
      const flick = 0.82 + Math.sin(performance.now() * 0.023) * 0.09 + Math.random() * 0.09;
      out.push({ x: fx, y: fy, r: 34 * this.props.flame, color: PAL.flame, i: 0.95 * this.props.flame * flick });
      out.push({ x: fx, y: fy, r: 10, color: '#fff0c0', i: 0.9 * this.props.flame });
    }
    return out;
  }

  // ---------------------------------------------------------------------
  // desenho
  // ---------------------------------------------------------------------

  draw(ctx, x, y) {
    if (!this.visible) return;
    const b = this.buf;
    b.x.setTransform(1, 0, 0, 1, 0, 0);
    b.x.globalCompositeOperation = 'source-over';
    b.x.globalAlpha = 1;
    b.x.clearRect(0, 0, BW, BH);
    this._lightLocal = null;
    this._renderRig(b.x);

    const px = Math.round(x), py = Math.round(y);
    // achatamento da virada: o sprite "gira" comprimindo em X
    const sq = 0.3 + 0.7 * Math.sin(clamp(this.flipT, 0, 1) * Math.PI / 2);

    let src = b.c;
    if (this.silhouette) {
      silhouettePass(b.c, this.rimBuf, this.silhouette);
      src = this.rimBuf.c;
    }

    // reflexo no chao molhado
    if (this.reflect > 0) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.globalAlpha = this.reflect * this.alpha;
      ctx.translate(px, py + 1);
      ctx.scale(this.facing * sq * this.scaleX, -0.82 * this.scaleY);
      ctx.drawImage(src, -ORX, -ORY);
      ctx.restore();
    }

    // luz de contorno (silhueta nao tem: ela nao reflete nada)
    const comRim = this.rimAlpha > 0 && !this.silhouette;
    if (comRim) rimPass(b.c, this.rimBuf, this.rimColor, this.rimDX * this.facing, this.rimDY);

    ctx.save();
    ctx.imageSmoothingEnabled = false;
    ctx.globalAlpha = this.alpha;
    ctx.translate(px, py);
    ctx.scale(this.facing * sq * this.scaleX, this.scaleY);
    ctx.drawImage(src, -ORX, -ORY);
    if (comRim) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = this.alpha * this.rimAlpha;
      ctx.drawImage(this.rimBuf.c, -ORX, -ORY);
    }
    ctx.restore();
  }

  _renderRig(g) {
    const p = this.pose;
    const R = a => -a * DEG;

    g.save();
    g.translate(ORX + p.hx, ORY + p.hy);

    // ---- perna de tras ----
    g.save();
    g.translate(-LEG_X, HIP_Y);
    g.rotate(R(p.lBt)); stamp(g, P.dThigh);
    g.translate(0, THIGH_LEN);
    g.rotate(R(p.lBs)); stamp(g, P.dShin);
    g.translate(0, SHIN_LEN);
    g.rotate(R(p.lBf - p.lBt - p.lBs)); stamp(g, P.dFoot);
    g.restore();

    const backArmFront = p.aBu > 42;   // soco de reverso passa para a frente

    // ---- braco de tras (atras do tronco) ----
    if (!backArmFront) this._arm(g, p, false, true);

    // ---- perna da frente ----
    g.save();
    g.translate(LEG_X, HIP_Y);
    g.rotate(R(p.lFt)); stamp(g, P.thigh);
    g.translate(0, THIGH_LEN);
    g.rotate(R(p.lFs)); stamp(g, P.shin);
    g.translate(0, SHIN_LEN);
    g.rotate(R(p.lFf - p.lFt - p.lFs)); stamp(g, P.foot);
    g.restore();

    // ---- aba do sobretudo (por cima das pernas, por baixo do tronco) ----
    g.save();
    g.translate(0, HIP_Y);
    g.rotate(R(this.skirt));
    stamp(g, P.coatSkirt);
    g.restore();

    // ---- coldre no quadril ----
    g.save();
    g.translate(6, HIP_Y + 1);
    stamp(g, P.holster);
    if (this.props.gun === 'holstered') { g.translate(1, 0); stamp(g, P.gunButt); }
    g.restore();

    // ---- tronco ----
    g.save();
    g.translate(0, HIP_Y);
    g.rotate(R(p.torso));
    stamp(g, P.torso);
    g.restore();

    // ---- cabeca (com a gola atras dela) ----
    g.save();
    g.translate(0, HIP_Y);
    g.rotate(R(p.torso));
    g.translate(0, SHOULDER_OFF);

  for (let i = 4; i < w; i += 6) rect(ctx, x + i, y - 14, 1, 14, md);
  // escada diagonal
  for (let i = 0; i < 16; i++) {
    rect(ctx, x + 4 + i, y + 4 + i, 6, 1, m);
  }
  grainRect(ctx, x, y - 14, w, 22, [PAL.rust], 0.06, seed);
}

function drainPipe(ctx, x, y, h, seed) {
  rect(ctx, x, y, 5, h, '#2b2f34');
  rect(ctx, x, y, 1, h, '#41474f');
  rect(ctx, x + 4, y, 1, h, '#15181b');
  for (let i = 0; i < h; i += 26) rect(ctx, x - 1, y + i, 7, 3, '#373c43');
  grainRect(ctx, x, y, 5, h, [PAL.rust, '#20241f'], 0.10, seed);
}

function poster(ctx, x, y, seed) {
  const w = 20, h = 27;
  rect(ctx, x, y, w, h, '#b8b09c');
  rect(ctx, x, y, w, 1, '#d6cfba');
  rect(ctx, x, y + h - 1, w, 1, '#7a7364');
  // "foto"
  rect(ctx, x + 4, y + 4, 12, 13, '#5c5648');
  rect(ctx, x + 7, y + 6, 6, 6, '#8b8271');
  rect(ctx, x + 6, y + 12, 8, 5, '#6e6757');
  // linhas de texto
  for (let i = 0; i < 4; i++) rect(ctx, x + 3, y + 19 + i * 2, 14 - i * 3, 1, '#4a4438');
  // rasgado e molhado
  grainRect(ctx, x, y, w, h, ['#8f8878', '#6a6456'], 0.13, seed);
  const rnd = mulberry32(seed + 4);
  for (let i = 0; i < 5; i++) {
    // cantos rasgados: sombra do papel faltando (nao pode ser clearRect,
    // isso abriria um buraco ate a camada de paralaxe)
    rect(ctx, x + rnd() * w, y + h - rnd() * 10, 2 + rnd() * 4, 1 + rnd() * 3, '#221a17');
  }
  return { x, y, w, h };
}

function graffiti(ctx, x, y, seed, color) {
  const rnd = mulberry32(seed);
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = color;
  let cx = x, cy = y;
  for (let s = 0; s < 90; s++) {
    ctx.fillRect(Math.round(cx), Math.round(cy), 2, 2);
    cx += rnd() * 5 - 1.4;
    cy += rnd() * 5 - 2.5;
    if (cy < y - 12) cy = y - 12;
    if (cy > y + 12) cy = y + 12;
  }
  ctx.globalAlpha = 1;
}

function boardedWindow(ctx, x, y, w, h, seed) {
  rect(ctx, x - 2, y - 2, w + 4, h + 4, '#1a1512');
  rect(ctx, x, y, w, h, '#0a0c10');
  const rnd = mulberry32(seed);
  for (let i = 0; i < 4; i++) {
    const by = y + 3 + i * (h / 4.4);
    const skew = Math.floor(rnd() * 3) - 1;
    woodPanel(ctx, x - 3, by + skew, w + 6, 5, seed + i * 3, { pw: 14 });
  }
  rect(ctx, x - 2, y - 2, w + 4, 1, '#2b2320');
}

// Porta de tamanho gente. O detetive tem 62px; uma porta real e uns 15%
// mais alta que um homem, entao 74. A versao antiga tinha 46 e ele parecia
// ter que entrar de quatro.
function doorFrame(ctx, x, gy, seed, opt = {}) {
  const w = 32, h = 74;
  const y = gy - h;
  // batente
  rect(ctx, x - 4, y - 4, w + 8, h + 4, '#1d1815');
  rect(ctx, x - 4, y - 4, w + 8, 2, '#2e2620');
  rect(ctx, x - 4, y - 4, 2, h + 4, '#251e19');
  // vao escuro
  rect(ctx, x, y, w, h, '#07080a');
  if (!opt.open) {
    woodPanel(ctx, x, y, w, h, seed, { pw: 11, hi: '#43301f', mid: '#31220f', dk: '#1e1409' });
    // almofadas
    rect(ctx, x + 4, y + 6, w - 8, 26, '#241806');
    rect(ctx, x + 5, y + 7, w - 10, 24, '#3a2712');
    rect(ctx, x + 4, y + 40, w - 8, 28, '#241806');
    rect(ctx, x + 5, y + 41, w - 10, 26, '#3a2712');
    // macaneta na altura da mao
    rect(ctx, x + w - 8, y + 36, 4, 4, PAL.brass);
    rect(ctx, x + w - 8, y + 36, 3, 1, '#d9c07a');
    rect(ctx, x + w - 9, y + 34, 6, 1, '#2a2018');
    grainRect(ctx, x, y, w, h, ['#1a1108', PAL.rust], 0.05, seed + 2);
  }
  return { x, y, w, h };
}

function streetLampPost(ctx, x, gy, hgt) {
  const y = gy - hgt;
  rect(ctx, x, y, 4, hgt, '#1b1e22');
  rect(ctx, x, y, 1, hgt, '#2e343a');
  rect(ctx, x - 3, gy - 4, 10, 4, '#15181b');
  // braco curvo
  for (let i = 0; i < 12; i++) {
    rect(ctx, x + 4 + i, y + Math.round(Math.pow(i / 12, 2) * 6) - 0, 2, 2, '#1b1e22');
  }
  // luminaria
  rect(ctx, x + 13, y + 5, 14, 3, '#22272c');
  rect(ctx, x + 14, y + 8, 12, 3, '#d9b070');
  rect(ctx, x + 15, y + 11, 10, 1, '#ffd79a');
  return { bulbX: x + 20, bulbY: y + 11 };
}

function bareBulb(ctx, x, y, len) {
  rect(ctx, x, y, 1, len, '#15181b');
  rect(ctx, x - 2, y + len, 5, 3, '#232a30');
  rect(ctx, x - 2, y + len + 3, 5, 3, '#e8c88a');
  rect(ctx, x - 1, y + len + 6, 3, 1, '#ffe6b0');
  return { bulbX: x, bulbY: y + len + 4 };
}

function neonSign(ctx, x, y, w, h) {
  // caixa da placa; o tubo aceso e desenhado por frame (pisca)
  rect(ctx, x - 2, y - 2, w + 4, h + 4, '#101215');
  rect(ctx, x - 2, y - 2, w + 4, 1, '#22262b');
  rect(ctx, x + w / 2 - 1, y - 12, 2, 10, '#191c20');
}

function barCounter(ctx, x, gy, w, seed) {
  const h = 30, y = gy - h;
  woodPanel(ctx, x, y + 5, w, h - 5, seed, { pw: 13, hi: '#63472e', mid: '#472f21', dk: '#2b1a10' });
  // tampo encerado
  rect(ctx, x - 3, y, w + 6, 5, '#7a5535');
  rect(ctx, x - 3, y, w + 6, 1, '#a0764a');
  rect(ctx, x - 3, y + 5, w + 6, 1, '#2a1a0c');
  // rodape de metal
  rect(ctx, x, gy - 6, w, 2, '#59493a');
  rect(ctx, x, gy - 6, w, 1, '#75604a');
  grainRect(ctx, x, y, w, h, ['#24160b', '#63472e'], 0.05, seed + 9);
}

function bottleShelf(ctx, x, y, w, seed) {
  const rnd = mulberry32(seed);
  rect(ctx, x, y + 16, w, 2, '#2e2118');
  rect(ctx, x, y + 16, w, 1, '#452f21');
  const cols = ['#2b4a3a', '#4a3a1e', '#3a2030', '#233848', '#4a2418'];
  for (let i = 0; i < w - 6; i += 5 + Math.floor(rnd() * 3)) {
    if (rnd() < 0.22) continue;
    const bh = 9 + Math.floor(rnd() * 6);
    const c = cols[Math.floor(rnd() * cols.length)];
    rect(ctx, x + i + 1, y + 16 - bh, 3, bh, c);
    rect(ctx, x + i + 1, y + 16 - bh, 1, bh, shade(c, 1.5));
    rect(ctx, x + i + 2, y + 16 - bh - 2, 1, 2, shade(c, 0.7));
  }
}

function crackedMirror(ctx, x, y, w, h, seed) {
  rect(ctx, x - 2, y - 2, w + 4, h + 4, '#2a1d14');
  rect(ctx, x - 2, y - 2, w + 4, 1, '#43301f');
  ditherV(ctx, x, y, w, h, '#39434f', '#1e2630', 5);
  grainRect(ctx, x, y, w, h, ['#48535f', '#161b21'], 0.05, seed);
  // trinca central com estilhacos
  const rnd = mulberry32(seed + 11);
  const cx = x + w * 0.42, cy = y + h * 0.4;
  for (let a = 0; a < 9; a++) {
    let px = cx, py = cy;
    const ang = rnd() * 6.28;
    const len = 8 + rnd() * Math.max(w, h) * 0.7;
    for (let s = 0; s < len; s++) {
      px += Math.cos(ang) + (rnd() - 0.5) * 0.7;
      py += Math.sin(ang) + (rnd() - 0.5) * 0.7;
      if (px < x || px > x + w || py < y || py > y + h) break;
      rect(ctx, px, py, 1, 1, '#5b6a78');
      if (rnd() < 0.25) rect(ctx, px + 1, py, 1, 1, '#0c1014');
    }
  }
}

function table(ctx, x, gy, w, seed) {
  const h = 22, y = gy - h;
  rect(ctx, x, y, w, 4, '#57402b');
  rect(ctx, x, y, w, 1, '#7a5c3c');
  rect(ctx, x, y + 4, w, 1, '#241609');
  rect(ctx, x + 3, y + 4, 4, h - 4, '#3d2a1c');
  rect(ctx, x + w - 7, y + 4, 4, h - 4, '#3d2a1c');
  rect(ctx, x + 3, y + 4, 1, h - 4, '#513a26');
  grainRect(ctx, x, y, w, 4, ['#241609'], 0.08, seed);
  return { x, y, w, h };
}

// Cadeiras empilhadas de cabeca para baixo em cima da mesa — a imagem de
// bar fechado. `n` = quantas.
function chairStack(ctx, x, topY, n, seed) {
  const rnd = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const y = topY - i * 10;
    const jx = Math.round((rnd() - 0.5) * 2);
    // assento (invertido)
    rect(ctx, x + jx, y, 18, 4, '#543b25');
    rect(ctx, x + jx, y, 18, 1, '#7a5836');
    rect(ctx, x + jx, y + 4, 18, 1, '#22150c');
    // pernas apontando pra cima
    rect(ctx, x + jx + 1, y - 8, 3, 8, '#43301e');
    rect(ctx, x + jx + 14, y - 8, 3, 8, '#43301e');
    rect(ctx, x + jx + 1, y - 8, 1, 8, '#5e452c');
    rect(ctx, x + jx + 14, y - 8, 1, 8, '#5e452c');
    // encosto pendurado para o lado
    rect(ctx, x + jx + (i % 2 ? -4 : 18), y + 1, 4, 11, '#43301e');
  }
}

function chair(ctx, x, gy, flip, seed) {
  const y = gy - 22;
  rect(ctx, x, y + 10, 14, 3, '#3a2718');
  rect(ctx, x, y + 10, 14, 1, '#523a25');
  rect(ctx, x + 1, y + 13, 2, 9, '#2c1d12');
  rect(ctx, x + 11, y + 13, 2, 9, '#2c1d12');
  const bx = flip ? x + 11 : x + 1;
  rect(ctx, bx, y, 2, 11, '#2c1d12');
  rect(ctx, bx - (flip ? 2 : 0), y, 4, 2, '#3a2718');
}

// ---------------------------------------------------------------------------
// destroco — o bar nao esta fechado, esta arrebentado
// ---------------------------------------------------------------------------

function brokenChair(ctx, x, gy, seed) {
  const rnd = mulberry32(seed);
  // assento caido de lado
  rect(ctx, x, gy - 7, 15, 4, '#4a3320');
  rect(ctx, x, gy - 7, 15, 1, '#6b4b2e');
  rect(ctx, x, gy - 3, 15, 1, '#20140b');
  // pernas quebradas apontando para fora
  rect(ctx, x + 2, gy - 16, 2, 9, '#3d2a1a');
  rect(ctx, x + 11, gy - 13, 2, 6, '#3d2a1a');
  rect(ctx, x + 16, gy - 5, 7, 2, '#3d2a1a');
  // encosto solto no chao
  rect(ctx, x - 9, gy - 2, 11, 2, '#43301e');
  for (let i = 0; i < 8; i++) {
    rect(ctx, x - 12 + rnd() * 30, gy - rnd() * 4, 1 + rnd() * 2, 1, '#2a1c11');
  }
}

function debris(ctx, x, gy, w, seed) {
  const rnd = mulberry32(seed);
  const cores = ['#3d2a1a', '#2a1c11', '#4a3626', '#1c120a', '#514032'];
  for (let i = 0; i < w * 2.2; i++) {
    const px = x + rnd() * w;
    const py = gy - rnd() * 7;
    rect(ctx, px, py, 1 + rnd() * 3, 1 + rnd() * 1.6, cores[Math.floor(rnd() * cores.length)]);
  }
  // algumas ripas maiores atravessadas
  for (let i = 0; i < 3; i++) {
    const px = x + rnd() * (w - 12);
    rect(ctx, px, gy - 2 - rnd() * 3, 9 + rnd() * 8, 2, '#43301e');
  }
}

function glassShards(ctx, x, gy, w, seed) {
  const rnd = mulberry32(seed);
  for (let i = 0; i < w * 0.9; i++) {
    const px = x + rnd() * w, py = gy - rnd() * 4;
    const c = rnd() > 0.55 ? '#5c6f74' : (rnd() > 0.5 ? '#3f5257' : '#7a8f92');
    rect(ctx, px, py, 1, 1, c);
    if (rnd() > 0.8) rect(ctx, px + 1, py, 1, 1, '#94a9ab');
  }
}

// Buraco no lambri: tabua arrebentada mostrando o escuro atras.
function wallHole(ctx, x, y, w, h, seed) {
  const rnd = mulberry32(seed);
  rect(ctx, x, y, w, h, '#0a0705');
  for (let i = 0; i < w; i++) {
    const t = Math.abs(i - w / 2) / (w / 2);
    const rec = Math.round((1 - t) * h * 0.35 * rnd());
    rect(ctx, x + i, y, 1, rec, '#2a1c11');
    rect(ctx, x + i, y + h - rec, 1, rec, '#2a1c11');
  }
  // farpas apontando para dentro
  for (let i = 0; i < 10; i++) {
    const px = x + rnd() * w, py = y + rnd() * h;
    rect(ctx, px, py, 1, 2 + rnd() * 4, '#43301e');
  }
  rect(ctx, x - 1, y - 1, w + 2, 1, '#5c452c');
}

// sangue
// ---------------------------------------------------------------------------

// Pingos espalhados numa faixa. Poucos e pequenos: uma trilha de sangue
// convence pelo espacamento, nao pela quantidade.
function bloodDrops(ctx, x, gy, w, n, seed) {
  const rnd = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const px = x + rnd() * w;
    const py = gy + 2 + rnd() * 8;
    const r = rnd();
    const c = r > 0.6 ? '#8a1c16' : (r > 0.25 ? '#6b1310' : '#4a0d0b');
    const s = 1 + Math.floor(rnd() * 2);
    rect(ctx, px, py, s, s, c);
    if (rnd() > 0.7) rect(ctx, px + 1, py + 1, 1, 1, '#a8241c');
    // respingo satelite
    if (rnd() > 0.75) rect(ctx, px + 2 + rnd() * 3, py + rnd() * 2, 1, 1, '#5c110e');
  }
}

function bloodPool(ctx, x, gy, w, seed) {
  const rnd = mulberry32(seed);
  const h = 7;
  for (let i = 0; i < w; i++) {
    const t = i / w;
    const hh = Math.max(1, Math.round(Math.sin(t * Math.PI) * h * (0.7 + rnd() * 0.5)));
    rect(ctx, x + i, gy + 8 - hh, 1, hh, '#5e100d');
  }
  // miolo mais escuro e brilho da borda molhada
  for (let i = 2; i < w - 2; i++) {
    const t = i / w;
    const hh = Math.max(1, Math.round(Math.sin(t * Math.PI) * (h - 3)));
    rect(ctx, x + i, gy + 8 - hh, 1, hh, '#430907');
  }
  for (let i = 0; i < w; i += 2) {
    if (rnd() > 0.5) rect(ctx, x + i, gy + 7, 1, 1, '#93211a');
  }
  // arrasto saindo da poca
  for (let i = 0; i < 14; i++) {
    rect(ctx, x - 4 - rnd() * 12, gy + 4 + rnd() * 5, 1 + rnd() * 2, 1, '#4a0d0b');
  }
}

// Papel dobrado caido no chao. Claro de proposito: e o unico ponto claro
// da sala, e e para onde o olho tem que ir.
function note(ctx, x, gy) {
  rect(ctx, x, gy + 2, 11, 7, '#0f0a08');
  rect(ctx, x, gy + 1, 11, 7, '#c9c2ad');
  rect(ctx, x, gy + 1, 11, 1, '#e2dcc6');
  rect(ctx, x + 1, gy + 3, 8, 1, '#8b8471');
  rect(ctx, x + 1, gy + 5, 6, 1, '#8b8471');
  rect(ctx, x + 7, gy + 1, 4, 4, '#b3ac97');   // dobra
  rect(ctx, x + 9, gy + 5, 2, 3, '#7d1712');   // canto encharcado
  return { x, y: gy + 1, w: 11, h: 8 };
}

// Cano de parede — o que prende as algemas na sala do fim.
function wallPipe(ctx, x, y, len, seed) {
  rect(ctx, x, y, len, 5, '#3c3f45');
  rect(ctx, x, y, len, 1, '#5a5f68');
  rect(ctx, x, y + 4, len, 1, '#1e2126');
  for (let i = 0; i < len; i += 34) {
    rect(ctx, x + i, y - 1, 4, 7, '#4a4e56');
    rect(ctx, x + i, y - 1, 4, 1, '#666c76');
  }
  grainRect(ctx, x, y, len, 5, [PAL.rust, '#2a2016'], 0.12, seed);
}

function wallPhone(ctx, x, y, seed) {
  rect(ctx, x, y, 12, 18, '#1c1f24');
  rect(ctx, x, y, 12, 1, '#2f343b');
  rect(ctx, x + 2, y + 3, 8, 6, '#0e1114');
  rect(ctx, x + 3, y + 4, 6, 4, '#242a30');
  // fone
  rect(ctx, x - 3, y + 2, 4, 12, '#141619');
  rect(ctx, x - 4, y + 1, 6, 3, '#1d2126');
  rect(ctx, x - 4, y + 12, 6, 3, '#1d2126');
  // fio cortado
  const rnd = mulberry32(seed);
  let px = x + 6, py = y + 18;
  for (let i = 0; i < 12; i++) {
    rect(ctx, px, py, 1, 1, '#101214');
    px += rnd() * 2 - 1; py += 1;
  }
  rect(ctx, px - 1, py, 3, 1, '#3a2a1a');
}

function windowBlinds(ctx, x, y, w, h) {
  rect(ctx, x - 2, y - 2, w + 4, h + 4, '#191410');
  ditherV(ctx, x, y, w, h, '#2b3a52', '#141d2b', 5);
  for (let i = 0; i < h; i += 3) {
    rect(ctx, x, y + i, w, 1, '#0d1118');
    rect(ctx, x, y + i + 1, w, 1, '#1c2634');
  }
  rect(ctx, x - 2, y - 2, w + 4, 2, '#241c16');
}

function puddle(ctx, x, gy, w, seed) {
  const rnd = mulberry32(seed);
  const h = 4 + Math.floor(rnd() * 3);
  for (let i = 0; i < w; i++) {
    const t = i / w;
    const hh = Math.max(1, Math.round(Math.sin(t * Math.PI) * h));
    ctx.globalAlpha = 0.5;
    rect(ctx, x + i, gy - hh + 1, 1, hh, '#1a2029');
    ctx.globalAlpha = 1;
  }
  ctx.globalAlpha = 0.35;
  rect(ctx, x + 2, gy - 1, w - 4, 1, '#39485c');
  ctx.globalAlpha = 1;
  return { x, y: gy - h, w, h };
}

function trashPile(ctx, x, gy, seed) {
  const rnd = mulberry32(seed);
  const cols = ['#2a2620', '#3a3228', '#1e1a16', '#4a3c28', '#28323a'];
  for (let i = 0; i < 40; i++) {
    const px = x + rnd() * 26;
    const py = gy - rnd() * 9;
    rect(ctx, px, py, 1 + rnd() * 3, 1 + rnd() * 2, cols[Math.floor(rnd() * cols.length)]);
  }
  rect(ctx, x + 4, gy - 8, 9, 8, '#191d21');
  rect(ctx, x + 4, gy - 8, 9, 1, '#262c31');
}

function manhole(ctx, x, gy) {
  rect(ctx, x, gy - 2, 22, 2, '#1a1d20');
  rect(ctx, x + 1, gy - 3, 20, 1, '#2b3036');
  for (let i = 0; i < 5; i++) rect(ctx, x + 3 + i * 4, gy - 2, 2, 1, '#12161a');
}

// Silhueta de predio para camadas de fundo. Devolve o topo, para empilhar.
function buildingSilhouette(ctx, x, gy, w, h, color, seed, litWindows) {
  const y = gy - h;
  rect(ctx, x, y, w, h, color);
  const rnd = mulberry32(seed);
  // topo com caixa d'agua ou antena
  if (rnd() > 0.5) { rect(ctx, x + w * 0.3, y - 6, 8, 6, color); rect(ctx, x + w * 0.3 + 3, y - 12, 1, 6, color); }
  if (litWindows) {
    for (let wy = y + 6; wy < gy - 8; wy += 9) {
      for (let wx = x + 4; wx < x + w - 6; wx += 8) {
        const r = rnd();
        if (r > 0.80) rect(ctx, wx, wy, 3, 4, '#c8a05a');
        else if (r > 0.72) rect(ctx, wx, wy, 3, 4, '#5a7ba8');
        else if (r > 0.58) rect(ctx, wx, wy, 3, 4, shade(color, 1.35));
      }
    }
  }
  return y;
}

    ],
  });

  // lampada balancando: move a luz E o sprite, entao a sombra da sala anda
  lvl.lampSwing = 0;

    const a = Math.sin(t * 0.9) * 7 + Math.sin(t * 0.37) * 3;
    lvl.lampSwing = a;
    lampGlow.x = lampCore.x = 430 + a;
    lampGlow.y = lampCore.y = 52 + Math.abs(a) * 0.12;
  };
  lvl.drawProps = (ctx, cam) => {
    // corpo da lampada, desenhado por frame porque balanca
    const ax = 430 - cam.ix;                    // ponto fixo no teto
    const bx = 430 + lvl.lampSwing - cam.ix;    // ponta do fio
    const y = Math.round(44 - cam.iy);
    ctx.fillStyle = '#0e0b08';
    for (let i = 0; i <= 44; i++) {
      const t = i / 44;
      ctx.fillRect(Math.round(ax + (bx - ax) * t), Math.round(-cam.iy + i), 1, 1);
    }
    const x = Math.round(bx);
    ctx.fillStyle = '#20252b';
    ctx.fillRect(x - 7, y, 15, 3);
    ctx.fillRect(x - 5, y + 3, 11, 3);
    ctx.fillStyle = '#e8c88a';
    ctx.fillRect(x - 3, y + 6, 7, 3);
    ctx.fillStyle = '#fff0c8';
    ctx.fillRect(x - 2, y + 9, 5, 1);
  };

  return lvl;
}

function buildCar() {

  // Carro claro de proposito. A cena e multiplicada pela luz ambiente da
  // noite; pintado na cor "real" ele sumiria dentro do proprio asfalto.
  // O comprimento (134px contra 62px de personagem) e o que da a escala
  // certa — carro curto faz o detetive parecer gigante.
  const body = '#4a3b42', hi = '#63505a', dk = '#2a2126', chrome = '#8f959e';

  // corpo
  rect(g, 10, 24, 114, 15, body);
  rect(g, 5, 29, 124, 10, body);
  rect(g, 10, 24, 114, 1, hi);
  rect(g, 5, 38, 124, 3, dk);
  // capo e porta-malas
  rect(g, 88, 21, 34, 5, body);
  rect(g, 13, 21, 28, 5, body);
  rect(g, 88, 21, 34, 1, hi);
  rect(g, 13, 21, 28, 1, hi);
  // cabine
  rect(g, 39, 8, 54, 16, body);
  rect(g, 41, 6, 50, 3, hi);
  // vidros
  rect(g, 44, 10, 19, 12, '#1d2833');
  rect(g, 66, 10, 23, 12, '#1d2833');
  rect(g, 44, 10, 19, 3, '#40566d');
  rect(g, 66, 10, 23, 3, '#40566d');
  rect(g, 63, 9, 3, 14, body);
  // cromados — e a linha clara que desenha a silhueta do carro no escuro
  rect(g, 8, 31, 118, 1, '#c2c8d2');
  rect(g, 39, 24, 54, 1, chrome);
  rect(g, 10, 24, 114, 1, '#7d8592');
  rect(g, 41, 6, 50, 1, '#9aa2ae');
  // para-choques
  rect(g, 2, 33, 8, 5, chrome);
  rect(g, 124, 33, 8, 5, chrome);
  rect(g, 2, 33, 8, 1, '#c2c8d2');
  rect(g, 124, 33, 8, 1, '#c2c8d2');
  // farol e lanterna
  rect(g, 122, 26, 7, 6, '#ffe0a8');
  rect(g, 123, 27, 5, 4, '#fff6d8');
  rect(g, 4, 26, 5, 5, '#8c2a22');
  rect(g, 4, 27, 4, 3, '#d8392c');
  // vinco da porta e macaneta
  rect(g, 58, 26, 1, 13, dk);
  rect(g, 52, 29, 5, 1, chrome);
  rect(g, 93, 26, 1, 13, dk);
  // caixa de rodas
  rect(g, 18, 37, 22, 5, dk);
  rect(g, 94, 37, 22, 5, dk);
  grainRect(g, 3, 6, 128, 36, ['#1a1418', '#3a2f36', '#40301f'], 0.03, 1401);

  // roda separada, para girar
  const wr = 10;
  const w = makeBuffer(wr * 2 + 1, wr * 2 + 1);
  const wg = w.x;
  for (let y = -wr; y <= wr; y++) {
    for (let x = -wr; x <= wr; x++) {
      const d = Math.sqrt(x * x + y * y);
      if (d <= wr) {
        let c = '#1c1a1e';
        if (d > wr - 1.4) c = '#0d0c0f';
        else if (d < 5) c = '#5a606a';
        else if (d < 6.2) c = '#33383f';
        rect(wg, x + wr, y + wr, 1, 1, c);
      }
    }
  }
  rect(wg, wr - 1, wr - 6, 2, 12, '#6e747e');
  rect(wg, wr - 6, wr - 1, 12, 2, '#6e747e');

  return { body: b.c, wheel: w.c, w: W, h: H, wr, wheels: [[29, 37], [105, 37]] };
}

function buildRoad() {
  const TILE = 480;
  const WALK_Y = 214;   // calcada — mesmo chao das outras fases
  const CURB_Y = 222;   // onde comeca o asfalto
  const ROAD_Y = 252;   // onde as rodas encostam (bem a frente da calcada)

  const sky = makeBuffer(VW, VH);
  ditherV(sky.x, 0, 0, VW, VH, '#0b1018', '#1a2130', 8);
  {
    const rnd = mulberry32(7001);
    for (let i = 0; i < 40; i++) {
      sky.x.globalAlpha = 0.10 + rnd() * 0.2;
      rect(sky.x, rnd() * VW, rnd() * 90, 1, 1, '#b8cbe8');
    }
    sky.x.globalAlpha = 1;
  }

  const far = makeBuffer(TILE, VH);
  {
    const rnd = mulberry32(7101);
    let x = -20;
    while (x < TILE + 20) {
      const w = 30 + rnd() * 50, h = 50 + rnd() * 70;
      M.buildingSilhouette(far.x, x, 168, w, h, '#0f1621', 7200 + x, true);
      x += w + 2;
    }
  }

class SlotPicker {
  constructor() {
    this.open = false;
    this.mode = 'load';
    this.sel = 0;
    this.confirm = null;   // 'over' | 'erase'
    this.confirmSel = 1;
    this.thumbs = [null, null, null];
    this.anim = 0;
    this.flash = 0;
  }

  show(mode, onPick, onCancel) {
    this.open = true;
    this.mode = mode;
    this.onPick = onPick;
    this.onCancel = onCancel;
    this.data = save.list();
    this.confirm = null;
    this.anim = 0;
    if (mode === 'load') {
      const r = save.mostRecent();
      this.sel = r >= 0 ? r : 0;
    }
    this._loadThumbs();
  }

  _loadThumbs() {
    for (let i = 0; i < SLOTS; i++) {
      this.thumbs[i] = null;
      const d = this.data[i];
      if (d && d.thumb) {
        const im = new Image();
        im.onload = () => { this.thumbs[i] = im; };
        im.src = d.thumb;
      }
    }
  }

  close() { this.open = false; }

  update(dt) {
    if (!this.open) return;
    this.anim = Math.min(1, this.anim + dt * 7);
    if (this.flash > 0) this.flash -= dt;

    if (this.confirm) {
      if (input.pressed('menuLeft') || input.pressed('menuRight')) {
        this.confirmSel = this.confirmSel ? 0 : 1; audio.uiMove();
      }
      if (input.pressed('confirm')) {
        audio.uiConfirm();
        const yes = this.confirmSel === 0;
        const kind = this.confirm;
        this.confirm = null;
        if (yes && kind === 'erase') {
          save.erase(this.sel);
          this.data = save.list();
          this._loadThumbs();
        } else if (yes && kind === 'over') {
          this._pick();
        }
      } else if (input.pressed('cancel')) {
        this.confirm = null; audio.uiBack();
      }
      return;
    }

    if (input.pressed('menuDown')) { this.sel = (this.sel + 1) % SLOTS; audio.uiMove(); }
    if (input.pressed('menuUp')) { this.sel = (this.sel + SLOTS - 1) % SLOTS; audio.uiMove(); }

    if (input.pressedFrame.has('Delete') && this.data[this.sel]) {
      this.confirm = 'erase'; this.confirmSel = 1; audio.uiMove();
      return;
    }

    if (input.pressed('confirm')) {
      const d = this.data[this.sel];
      if (this.mode === 'load') {
        if (d) { audio.uiConfirm(); this._pick(); }
        else audio.uiBack();
      } else {
        if (d) { this.confirm = 'over'; this.confirmSel = 1; audio.uiMove(); }
        else { audio.uiConfirm(); this._pick(); }
      }
    } else if (input.pressed('cancel')) {
      audio.uiBack();
      this.open = false;
      if (this.onCancel) this.onCancel();
    }
  }

  _pick() {
    const i = this.sel;
    if (this.onPick) this.onPick(i, () => {
      // callback de "salvou" — atualiza a lista sem fechar
      this.data = save.list();
      this._loadThumbs();
      this.flash = 1.4;
    });
    if (this.mode === 'load') this.open = false;
  }

  draw(ctx) {
    if (!this.open) return;
    const a = this.anim;
    screenDim(ctx, 0.90 * a);
    text(ctx, T(this.mode === 'save' ? 'slots_title_save' : 'slots_title_load'), VW / 2, 42, {
      size: 15, font: 'serif', color: PAL.uiText, align: 'center', track: 2, shadow: true, alpha: a,
    });

    for (let i = 0; i < SLOTS; i++) {
      const y = ROW_Y0 + i * (ROW_H + ROW_GAP);
      const on = i === this.sel;
      const ox = on ? 3 : 0;
      panelBox(ctx, ROW_X + ox, y, ROW_W, ROW_H, a, on);

      // miniatura
      const tw = 66, th = 37;
      const tx = ROW_X + ox + 6, ty = y + (ROW_H - th) / 2;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.fillStyle = '#000';
      ctx.fillRect(tx, ty, tw, th);
      if (this.thumbs[i]) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(this.thumbs[i], tx, ty, tw, th);
      }
      ctx.fillStyle = on ? PAL.uiAccent : '#241d1c';
      ctx.fillRect(tx, ty, tw, 1);
      ctx.fillRect(tx, ty + th - 1, tw, 1);
      ctx.restore();

      const lx = tx + tw + 10;
      const d = this.data[i];
      text(ctx, `${T('slot')} ${i + 1}`, lx, y + 7, {
        size: 9, font: 'ui', weight: 'bold', color: on ? PAL.uiText : PAL.uiDim, track: 2, alpha: a,
      });

      if (d) {

          size: 10, font: 'serif', color: on ? '#e0d8c8' : '#8d8478', alpha: a,

        text(ctx, formatDate(d.savedAt, getLang()), ROW_X + ox + ROW_W - 8, y + 33, {
          size: 8, font: 'ui', color: PAL.uiFaint, align: 'right', track: 1, alpha: a,
        });
      } else {
        text(ctx, T('slot_empty'), lx, y + 21, {
          size: 10, font: 'serif', color: '#4a423a', alpha: a,
        });
      }

      text(ctx, opts[i], ox, y + 38, {
        size: 11, font: 'ui', weight: 'bold', track: 2,
        color: on ? PAL.uiAccent : PAL.uiDim,
      });
      if (on) { ctx.fillStyle = PAL.uiAccent; ctx.fillRect(ox - 9, y + 42, 5, 1); }
    }
  }
}

      text(ctx, T(r.key), x, y, {
