<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midnight Call</title>
<style>
/* The Midnight Call — casca da pagina.
   Tudo que e jogo acontece dentro do canvas. Aqui so existe o preto ao redor,
   o escalonamento e as duas telas de emergencia (boot e crash). */

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Tahoma, Verdana, sans-serif;
  color: #7d7468;
}

#stage {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
}

#game {
  display: block;
  /* O canvas e redimensionado por JS (gfx.resize). Estas regras garantem que
     o navegador nunca suavize os pixels na hora de mostrar. */
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  -ms-interpolation-mode: nearest-neighbor;
  background: #000;
}

body.playing { cursor: none; }

/* ---------- tela de boot ---------- */

#boot {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  z-index: 10;
  transition: opacity .6s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }

.boot-inner { text-align: center; }

.boot-title {
  font-family: Impact, Haettenschweiler, "Arial Black", sans-serif;
  font-size: 34px;
  letter-spacing: 6px;
  color: #5c5248;
  text-shadow: 0 0 18px rgba(150, 40, 30, .35);
  animation: bootpulse 3.4s ease-in-out infinite;
}

.boot-hint {
  margin-top: 14px;
  font-size: 11px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #3d372f;
}

.boot-prev {
  margin-top: 22px;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #6e3229;
  cursor: pointer;
  text-decoration: underline;
}
.boot-prev:hover { color: #a63c2e; }

@keyframes bootpulse {
  0%, 100% { opacity: .55; }
  50%      { opacity: .95; }
}

/* ---------- tela de crash ---------- */

#crash {
  position: fixed;
  inset: 0;
  background: #0a0708;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}

/* ATENCAO: sem esta regra a tela de erro fica visivel PARA SEMPRE.
   O atributo hidden do HTML so funciona por causa da regra [hidden]
   { display: none } do navegador — e o seletor de ID acima, com
   prioridade maior, cancela ela. O jogo roda normalmente atras da tela
   preta e parece que travou. Custou uma sessao inteira de caca ao bug. */
#crash[hidden] { display: none !important; }

.crash-inner { max-width: 780px; }

.crash-title {
  font-family: Impact, sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  color: #a63c2e;
  margin-bottom: 14px;
}

#crash-msg {
  font-family: Consolas, "Courier New", monospace;
  font-size: 12px;
  line-height: 1.6;
  color: #8b8177;
  background: #120e0f;
  border: 1px solid #241c1d;
  padding: 14px;
  max-height: 46vh;
  overflow: auto;
  white-space: pre-wrap;
  user-select: text;
}

.crash-actions {
  margin-top: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.crash-actions button {
  font-family: Tahoma, Verdana, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: #cfc6b8;
  background: #1a1416;
  border: 1px solid #3a2f2c;
  padding: 7px 14px;
  cursor: pointer;
}

.crash-actions button:hover {
  background: #2a2022;
  border-color: #a63c2e;
  color: #fff;
}

#crash-copied {
  font-size: 11px;
  letter-spacing: 2px;
  color: #7a9c6a;
}

.crash-hint {
  margin-top: 12px;
  font-size: 11px;
  letter-spacing: 1px;
  color: #4a423a;
}

</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="480" height="270"></canvas>
  </div>

  <div id="boot">
    <div class="boot-inner">
      <p class="boot-title">THE MIDNIGHT CALL</p>
      <p class="boot-hint" id="boot-msg">carregando&#8230;</p>
      <p class="boot-prev" id="boot-prev" hidden>ver o ultimo erro</p>
    </div>
  </div>

  <div id="crash" hidden>
    <div class="crash-inner">
      <p class="crash-title">O jogo travou.</p>
      <pre id="crash-msg"></pre>
      <div class="crash-actions">
        <button id="crash-copy" type="button">COPIAR ERRO</button>
        <button id="crash-reload" type="button">RECARREGAR</button>
        <span id="crash-copied"></span>
      </div>
      <p class="crash-hint">Clique em COPIAR ERRO e cole no chat. E esse texto que diz o que quebrou.</p>
    </div>
  </div>

  <script>
    // Rede de seguranca. Um modulo que explode em silencio deixa a tela preta
    // e sem pista nenhuma; aqui o erro vira texto que o jogador copia com um
    // clique. Vale mais que qualquer descricao do que ele viu acontecer.
    (function () {
      var LS_KEY = 'tmc.lastError';

      function ambiente() {
        var g = window.game;
        var linhas = [
          'navegador: ' + navigator.userAgent,
          'tela: ' + window.innerWidth + 'x' + window.innerHeight +
            ' dpr' + (window.devicePixelRatio || 1),
          'url: ' + location.href,
        ];
        if (g) {
          linhas.push('estado: ' + g.state +
            '  fase: ' + (g.level ? g.level.key : '-') +
            '  fps: ' + (g.fps ? g.fps.toFixed(0) : '-'));
          if (g.player) {
            linhas.push('jogador: x=' + Math.round(g.player.x) +
              ' estado=' + g.player.state +
              ' anim=' + (g.player.det ? g.player.det.anim : '-'));
          }
          if (g.opening) linhas.push('cutscene: ' + g.opening.phase);
        } else {
          linhas.push('estado: o jogo nem chegou a carregar');
          var b = document.getElementById('boot-msg');
          if (b) linhas.push('boot parou em: "' + b.textContent + '"');
        }
        return linhas.join('\n');
      }

      function mostrar(titulo, detalhe) {
        var box = document.getElementById('crash');
        var msg = document.getElementById('crash-msg');
        if (!box || box.hidden === false) return;
        var texto = titulo + '\n\n' + detalhe + '\n\n--- ambiente ---\n' + ambiente();
        box.hidden = false;
        msg.textContent = texto;
        try { localStorage.setItem(LS_KEY, texto); } catch (e) { /* sem espaco */ }
      }

      window.__crash = mostrar;

      window.addEventListener('error', function (e) {
        mostrar(
          e.message || 'erro desconhecido',
          (e.filename || '') + ':' + (e.lineno || 0) + ':' + (e.colno || 0) + '\n\n' +
          (e.error && e.error.stack ? e.error.stack : '(sem pilha)')
        );
      });

      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        mostrar('Promise rejeitada', (r && r.stack) ? r.stack : String(r));
      });

      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('crash-copy').addEventListener('click', function () {
          var t = document.getElementById('crash-msg').textContent;
          var aviso = document.getElementById('crash-copied');
          function ok() { aviso.textContent = 'copiado'; }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(t).then(ok, fallback);
          } else fallback();
          function fallback() {
            var ta = document.createElement('textarea');
            ta.value = t; document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); ok(); }
            catch (e) { aviso.textContent = 'selecione o texto e copie a mao'; }
            document.body.removeChild(ta);
          }
        });
        document.getElementById('crash-reload').addEventListener('click', function () {
          location.reload();
        });

        // O erro fica guardado. Se o jogador fechou a tela ou recarregou, o
        // texto nao se perde — ele reaparece a um clique na tela de abertura.
        var anterior = null;
        try { anterior = localStorage.getItem(LS_KEY); } catch (e) { /* sem acesso */ }
        if (anterior) {
          var link = document.getElementById('boot-prev');
          link.hidden = false;
          link.addEventListener('click', function () {
            var box = document.getElementById('crash');
            box.hidden = false;
            document.getElementById('crash-msg').textContent = anterior;
          });
        }

        // Vigia do carregamento. Um modulo que nao chega (servidor caiu no
        // meio, arquivo faltando) nao dispara erro nenhum: a tela fica
        // pulsando "carregando..." para sempre e nao ha nada para copiar.
        // Depois de 15 segundos isso vira um diagnostico de verdade.
        setTimeout(function () {
          var g = window.game;
          if (g && g.state && g.state !== 'boot') return;
          var passo = (document.getElementById('boot-msg') || {}).textContent || '?';
          var causa = g
            ? 'Os modulos carregaram, mas a construcao das fases nao terminou.\n' +
              'Parou no passo: "' + passo + '"'
            : 'Os modulos JavaScript nao carregaram.\n\n' +
              'Causa quase certa: a pagina foi aberta sem o servidor local, ou o\n' +
              'servidor caiu. Feche o navegador, feche todas as janelas pretas do\n' +
              'jogo e rode ABRIR_JOGO.bat de novo. O endereco tem que comecar com\n' +
              'http://localhost — se comecar com file:// o navegador bloqueia os\n' +
              'modulos e o jogo nunca sai daqui.';
          mostrar('O jogo nao terminou de carregar', causa);
        }, 15000);
      });
    })();
  </script>
<script>
(function(){
var __mods = {}, __cache = {};
function __req(id){
  if (__cache[id]) return __cache[id];
  var e = {}; __cache[id] = e;
  if (!__mods[id]) throw new Error("modulo ausente no pacote: " + id);
  __mods[id](e); return e;
}
__mods["core/gfx.js"] = function(__exp){
// gfx.js — o pipeline de imagem inteiro do jogo.
//
// Regra de ouro: TUDO e desenhado numa tela interna de 480x270. O navegador
// so amplia o resultado final, com nearest-neighbor, entao o pixel nunca
// borra. Nenhum modulo do jogo deve tocar no canvas visivel direto.
//
// Ordem de um frame:
//   gfx.begin()            limpa a cena
//   ... desenha mundo ...  em gfx.s (contexto 480x270)
//   gfx.beginLights(cor)   pinta o buffer de luz com a luz ambiente
//   ... gfx.addLight(...)  cada lampada/fogo/isqueiro soma luz
//   gfx.endLights()        multiplica luz sobre a cena + bloom
//   ... desenha UI ...     UI vem DEPOIS da luz, senao o menu fica escuro
//   gfx.present(dt)        grao, vinheta, scanline, fade, letterbox, shake

const VW = 480;
const VH = 270;

function makeBuffer(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const x = c.getContext('2d', { alpha: true });
  x.imageSmoothingEnabled = false;
  return { c, x };
}

// Ruido determinístico: mesma semente, mesmo resultado. Serve para grao,
// tijolo, ferrugem — coisas que precisam parecer aleatorias mas identicas
// a cada carregamento (senao o cenario "pisca" quando e reconstruido).
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeInOut = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeIn = t => t * t * t;

class Gfx {
  constructor() {
    this.scale = 1;
    this.shakeAmt = 0;
    this.shakeTime = 0;
    this.fade = 0;            // 0 = nada, 1 = preto total
    this.fadeColor = '#000000';
    this.flash = 0;
    this.flashColor = '#ffffff';
    this.letterbox = 0;       // 0..1 — altura das barras de cinema
    this.eyelid = 1;          // 1 = olhos abertos, 0 = fechados
    // Grao discreto de proposito. Acima de ~0.03 o ruido comeca a comer os
    // pixels do rosto do personagem, que tem 14px de largura — o que sobra
    // e uma cara suja e sem expressao.
    this.grainAmount = 0.018;
    this.scanlines = 0.07;
    this.vignetteAmount = 0.9;
    this.pixelPerfect = false;
    this.time = 0;
  }

  init() {
    this.out = document.getElementById('game');
    this.o = this.out.getContext('2d', { alpha: false });
    this.o.imageSmoothingEnabled = false;

    const scene = makeBuffer(VW, VH);
    this.sceneC = scene.c; this.s = scene.x;

    const light = makeBuffer(VW, VH);
    this.lightC = light.c; this.l = light.x;

    // Buffer de brilho em 1/4 da resolucao. Ampliar ele DE VOLTA com
    // suavizacao ligada e um blur gaussiano de pobre — e o que faz o poste
    // de luz ter halo em vez de borda dura.
    const glow = makeBuffer(VW >> 2, VH >> 2);
    this.glowC = glow.c; this.g = glow.x;
    this.g.imageSmoothingEnabled = true;

    const tmp = makeBuffer(VW, VH);
    this.tmpC = tmp.c; this.t = tmp.x;

    const tmp2 = makeBuffer(VW, VH);
    this.tmp2C = tmp2.c; this.t2 = tmp2.x;

    this._buildGrain();
    this._buildVignette();
    this._buildScanlines();

    this.resize();
    window.addEventListener('resize', () => this.resize());
    return this;
  }

  _buildGrain() {
    this.grain = [];
    const rnd = mulberry32(0xC0FFEE);
    for (let i = 0; i < 6; i++) {
      const b = makeBuffer(VW, VH);
      const img = b.x.createImageData(VW, VH);
      const d = img.data;
      for (let p = 0; p < d.length; p += 4) {
        const v = (rnd() * 255) | 0;
        d[p] = v; d[p + 1] = v; d[p + 2] = v; d[p + 3] = 255;
      }
      b.x.putImageData(img, 0, 0);
      this.grain.push(b.c);
    }
    this.grainIdx = 0;
    this.grainTimer = 0;
  }

  _buildVignette() {
    const b = makeBuffer(VW, VH);
    const g = b.x.createRadialGradient(VW / 2, VH / 2, VH * 0.28, VW / 2, VH / 2, VH * 0.86);
    g.addColorStop(0, 'rgba(255,255,255,1)');
    g.addColorStop(0.55, 'rgba(206,200,196,1)');
    g.addColorStop(1, 'rgba(56,50,54,1)');
    b.x.fillStyle = g;
    b.x.fillRect(0, 0, VW, VH);
    this.vignetteC = b.c;
  }

  _buildScanlines() {
    const b = makeBuffer(4, 4);
    b.x.fillStyle = 'rgba(255,255,255,1)';
    b.x.fillRect(0, 0, 4, 4);
    b.x.fillStyle = 'rgba(120,120,130,1)';
    b.x.fillRect(0, 1, 4, 1);
    this.scanC = b.c;
    this.scanPattern = this.t.createPattern(b.c, 'repeat');
  }

  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    let sc = Math.min(w / VW, h / VH);
    if (this.pixelPerfect) sc = Math.max(1, Math.floor(sc));
    this.scale = sc;
    this.out.style.width = Math.round(VW * sc) + 'px';
    this.out.style.height = Math.round(VH * sc) + 'px';
  }

  // Ponto da janela -> ponto da tela interna de 480x270. O canvas e
  // ampliado por CSS, entao dividir pela escala nao basta: e preciso o
  // retangulo real dele na pagina.
  toVirtual(cx, cy) {
    if (!this.out) return { x: 0, y: 0 };
    const r = this.out.getBoundingClientRect();
    return {
      x: (cx - r.left) / (r.width || 1) * VW,
      y: (cy - r.top) / (r.height || 1) * VH,
    };
  }

  shake(amount, dur = 0.35) {
    this.shakeAmt = Math.max(this.shakeAmt, amount);
    this.shakeTime = Math.max(this.shakeTime, dur);
    this.shakeDur = this.shakeTime;
  }

  begin(clearColor) {
    const s = this.s;
    this.protect = null;          // cada estado decide de novo o que poupar
    s.setTransform(1, 0, 0, 1, 0, 0);
    s.globalCompositeOperation = 'source-over';
    s.globalAlpha = 1;
    if (clearColor) { s.fillStyle = clearColor; s.fillRect(0, 0, VW, VH); }
    else s.clearRect(0, 0, VW, VH);
  }

  // ---------- luz ----------

  beginLights(ambient) {
    const l = this.l, g = this.g;
    l.setTransform(1, 0, 0, 1, 0, 0);
    l.globalCompositeOperation = 'source-over';
    l.globalAlpha = 1;
    l.fillStyle = ambient;
    l.fillRect(0, 0, VW, VH);
    l.globalCompositeOperation = 'lighter';

    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1;
    g.clearRect(0, 0, VW >> 2, VH >> 2);
    g.globalCompositeOperation = 'lighter';
  }

  // Luz redonda. `falloff` < 1 concentra o miolo, > 1 espalha.
  addLight(x, y, r, color, intensity = 1, falloff = 1) {
    if (r <= 0 || intensity <= 0) return;
    if (x + r < 0 || x - r > VW || y + r < 0 || y - r > VH) return;
    const l = this.l;
    const grad = l.createRadialGradient(x, y, 0, x, y, r);
    const rgb = hexToRgb(color);
    const mid = clamp(0.42 * falloff, 0.05, 0.9);
    grad.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity})`);
    grad.addColorStop(mid, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity * 0.42})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    l.fillStyle = grad;
    l.fillRect(x - r, y - r, r * 2, r * 2);

    const g = this.g, q = 0.25;
    const gx = x * q, gy = y * q, gr = r * q;
    const grad2 = g.createRadialGradient(gx, gy, 0, gx, gy, gr);
    grad2.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity * 0.9})`);
    grad2.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad2;
    g.fillRect(gx - gr, gy - gr, gr * 2, gr * 2);
  }

  // Cone de luz — poste de rua, farol de carro, lanterna.
  addCone(x, y, angle, spread, len, color, intensity = 1) {
    const l = this.l;
    const rgb = hexToRgb(color);
    l.save();
    l.translate(x, y);
    l.rotate(angle);
    const grad = l.createLinearGradient(0, 0, len, 0);
    grad.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity})`);
    grad.addColorStop(0.45, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity * 0.45})`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    l.fillStyle = grad;
    l.beginPath();
    l.moveTo(0, 0);
    l.lineTo(len, -Math.tan(spread / 2) * len);
    l.lineTo(len, Math.tan(spread / 2) * len);
    l.closePath();
    l.fill();
    l.restore();

    const g = this.g, q = 0.25;
    g.save();
    g.translate(x * q, y * q);
    g.rotate(angle);
    const grad2 = g.createLinearGradient(0, 0, len * q, 0);
    grad2.addColorStop(0, `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${intensity * 0.7})`);
    grad2.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad2;
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(len * q, -Math.tan(spread / 2) * len * q);
    g.lineTo(len * q, Math.tan(spread / 2) * len * q);
    g.closePath();
    g.fill();
    g.restore();
  }

  endLights(bloom = 0.5) {
    const s = this.s;
    s.globalCompositeOperation = 'multiply';
    s.globalAlpha = 1;
    s.drawImage(this.lightC, 0, 0);

    if (bloom > 0) {
      s.globalCompositeOperation = 'lighter';
      s.globalAlpha = bloom;
      s.imageSmoothingEnabled = true;
      s.drawImage(this.glowC, 0, 0, VW, VH);
      s.imageSmoothingEnabled = false;
      s.globalAlpha = 1;
    }
    s.globalCompositeOperation = 'source-over';
  }

  // ---------- pos-processamento e apresentacao ----------

  // Aplica um efeito de tela cheia poupando o retangulo `protect` — que e
  // onde o personagem esta. Grao e scanline em cima de um rosto de 14px
  // comem os pixels que desenham o olho e a boca, e ele fica com cara de
  // borrao. Fora dele o efeito vale inteiro; em cima dele, um quarto.
  _post(modo, alpha, desenha) {
    const s = this.s, p = this.protect;
    if (!p) {
      s.save();
      s.globalCompositeOperation = modo;
      s.globalAlpha = alpha;
      desenha(s);
      s.restore();
      return;
    }
    s.save();
    s.beginPath();
    s.rect(0, 0, VW, VH);
    s.rect(p.x, p.y, p.w, p.h);
    s.clip('evenodd');            // tudo menos o personagem
    s.globalCompositeOperation = modo;
    s.globalAlpha = alpha;
    desenha(s);
    s.restore();

    s.save();
    s.beginPath();
    s.rect(p.x, p.y, p.w, p.h);
    s.clip();
    s.globalCompositeOperation = modo;
    s.globalAlpha = alpha * 0.25;
    desenha(s);
    s.restore();
  }

  present(dt) {
    this.time += dt;
    const s = this.s, o = this.o;
    s.setTransform(1, 0, 0, 1, 0, 0);
    s.globalCompositeOperation = 'source-over';
    s.globalAlpha = 1;

    if (this.vignetteAmount > 0) {
      s.globalCompositeOperation = 'multiply';
      s.globalAlpha = this.vignetteAmount;

    estalo.playbackRate.value = 1.6;
    const hp = c.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 1400;
    estalo.connect(hp);
    this._env(hp, t, 0.001, 0.10, 0.55 * vol);
    estalo.start(t, Math.random() * 3, 0.2); estalo.stop(t + 0.2);

    const corpo = c.createBufferSource();
    corpo.buffer = this.noiseBuf;
    corpo.playbackRate.value = 0.5;
    const lp = c.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.setValueAtTime(1800, t);
    lp.frequency.exponentialRampToValueAtTime(200, t + 0.25);
    corpo.connect(lp);
    const g1 = this._env(lp, t, 0.001, 0.28, 0.5 * vol);
    g1.connect(this.verb);
    corpo.start(t, Math.random() * 3, 0.5); corpo.stop(t + 0.5);

    const soco = c.createOscillator();
    soco.type = 'sine';
    soco.frequency.setValueAtTime(220, t);
    soco.frequency.exponentialRampToValueAtTime(40, t + 0.16);
    this._env(soco, t, 0.001, 0.2, 0.55 * vol);
    soco.start(t); soco.stop(t + 0.25);

    // cauda batendo nas paredes
    const cauda = c.createBufferSource();
    cauda.buffer = this.noiseBuf;
    cauda.playbackRate.value = 0.8;
    const bp = c.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.value = 900;
    cauda.connect(bp);
    const g2 = this._env(bp, t + 0.04, 0.05, 0.9, 0.16 * vol);
    g2.connect(this.verb);
    cauda.start(t + 0.04, Math.random() * 2, 1.2); cauda.stop(t + 1.2);
  }

  dryClick() {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 9; f.frequency.value = 2600;
    s.connect(f);
    this._env(f, t, 0.001, 0.035, 0.20);
    s.start(t, Math.random() * 3, 0.06); s.stop(t + 0.08);
  }

  // couro e metal: sacar, guardar, recarregar
  leather(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.9;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 1.4;
    f.frequency.setValueAtTime(500, t);
    f.frequency.exponentialRampToValueAtTime(1500, t + 0.14);
    s.connect(f);
    this._env(f, t, 0.006, 0.16, 0.13 * vol);
    s.start(t, Math.random() * 3, 0.3); s.stop(t + 0.3);
  }

  reloadClick(pitch = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 12; f.frequency.value = 1800 * pitch;
    s.connect(f);
    this._env(f, t, 0.001, 0.05, 0.16);
    s.start(t, Math.random() * 3, 0.08); s.stop(t + 0.1);
  }

  // ---------------- tensao ----------------
  // Duas serras desafinadas uma contra a outra (o batimento entre elas e o
  // que incomoda), um sopro agudo por cima e um filtro que vai abrindo.
  // Tudo controlado por um numero so: 0 = longe, 1 = em cima de voce.

  startDread() {
    if (!this.ensure()) return;
    if (this.dread) return;
    const c = this.ctx, t = c.currentTime;

    const saida = c.createGain();
    saida.gain.setValueAtTime(0.0001, t);
    saida.connect(this.busMusic);

    const filtro = c.createBiquadFilter();
    filtro.type = 'lowpass';
    filtro.frequency.setValueAtTime(240, t);
    filtro.Q.value = 3;
    filtro.connect(saida);

    const a = c.createOscillator(); a.type = 'sawtooth'; a.frequency.value = 41.2;
    const b = c.createOscillator(); b.type = 'sawtooth'; b.frequency.value = 42.1;
    const ga = c.createGain(); ga.gain.value = 0.5;
    a.connect(ga); b.connect(ga); ga.connect(filtro);
    a.start(t); b.start(t);

    // sopro agudo, quase inaudivel no comeco
    const ar = c.createBufferSource();
    ar.buffer = this.noiseBuf; ar.loop = true; ar.playbackRate.value = 1.4;
    const af = c.createBiquadFilter();
    af.type = 'bandpass'; af.Q.value = 2.2; af.frequency.value = 3200;
    const ag = c.createGain(); ag.gain.value = 0.0;
    ar.connect(af); af.connect(ag); ag.connect(saida);
    ar.start(t);

    this.dread = { saida, filtro, a, b, ar, ag };
    this.setDread(0);
  }

  setDread(k) {
    const d = this.dread;
    if (!d || !this.ready) return;
    const t = this.ctx.currentTime, r = 0.25;
    const ramp = (p, v) => {
      p.cancelScheduledValues(t); p.setValueAtTime(p.value, t);
      p.linearRampToValueAtTime(Math.max(0.0001, v), t + r);
    };
    ramp(d.saida.gain, 0.05 + k * 0.42);
    ramp(d.filtro.frequency, 240 + k * k * 1500);
    ramp(d.ag.gain, k * k * 0.05);
    // as duas serras se afastam: quanto mais perto, mais aspero o batimento
    ramp(d.b.frequency, 42.1 + k * 3.4);
  }

  // corte seco: e o silencio subito que da o susto, nao o barulho
  stopDread(fade = 0) {
    const d = this.dread;
    if (!d) return;
    const t = this.ctx.currentTime;
    d.saida.gain.cancelScheduledValues(t);
    d.saida.gain.setValueAtTime(d.saida.gain.value, t);
    d.saida.gain.linearRampToValueAtTime(0.0001, t + Math.max(0.008, fade));
    const stop = t + Math.max(0.02, fade) + 0.05;
    try { d.a.stop(stop); d.b.stop(stop); d.ar.stop(stop); } catch (e) {}
    this.dread = null;
  }

  heartbeat(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    for (let i = 0; i < 2; i++) {
      const o = c.createOscillator();
      o.type = 'sine';
      const t0 = t + i * 0.17;
      o.frequency.setValueAtTime(64, t0);
      o.frequency.exponentialRampToValueAtTime(30, t0 + 0.14);
      this._env(o, t0, 0.006, 0.16, (i ? 0.28 : 0.42) * vol, this.busMusic);
      o.start(t0); o.stop(t0 + 0.24);
    }
  }

  // pancada surda na nuca
  thud(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(28, t + 0.22);
    const g = this._env(o, t, 0.001, 0.34, 0.8 * vol);
    g.connect(this.verb);
    o.start(t); o.stop(t + 0.45);
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 700;
    s.connect(f);
    this._env(f, t, 0.001, 0.16, 0.5 * vol);
    s.start(t, Math.random() * 3, 0.3); s.stop(t + 0.3);
  }

  // zumbido de ouvido depois da pancada
  tinnitus(dur = 3) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine'; o.frequency.value = 3100;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.045, t + 0.15);
    g.gain.linearRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.2);
  }

  // ---------------- sons pontuais de ambiente ----------------
  // Sao estes, e nao um loop, que dizem em que lugar voce esta: uma gota
  // que cai a cada oito segundos num galpao vazio conta mais do que
  // qualquer textura de fundo.

  drip(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(900 + Math.random() * 500, t);
    o.frequency.exponentialRampToValueAtTime(260, t + 0.09);
    const g = this._env(o, t, 0.001, 0.12, 0.12 * vol);
    g.connect(this.verb);
    o.start(t); o.stop(t + 0.2);
  }

  metalCreak(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.3;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 22;
    const base = 300 + Math.random() * 500;
    f.frequency.setValueAtTime(base, t);
    f.frequency.linearRampToValueAtTime(base * 1.5, t + 0.9);
    f.frequency.linearRampToValueAtTime(base * 1.2, t + 1.8);
    s.connect(f);
    const g = this._env(f, t, 0.3, 1.6, 0.10 * vol);
    g.connect(this.verb);
    s.start(t, Math.random() * 2, 2.2); s.stop(t + 2.2);
  }

  chainRattle(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    for (let i = 0; i < 5; i++) {
      const s = c.createBufferSource();
      s.buffer = this.noiseBuf;
      const f = c.createBiquadFilter();
      f.type = 'bandpass'; f.Q.value = 16;
      f.frequency.value = 2200 + Math.random() * 1800;
      s.connect(f);
      const g = this._env(f, t + i * 0.045 * (0.6 + Math.random()), 0.001, 0.05, 0.07 * vol);
      g.connect(this.verb);
      s.start(t + i * 0.05, Math.random() * 3, 0.1); s.stop(t + i * 0.05 + 0.12);
    }
  }

  // longe, do lado de fora, alguem fechando alguma coisa pesada
  distantThump(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(90, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 0.3);
    const g = this._env(o, t, 0.01, 0.4, 0.16 * vol);
    g.connect(this.verb);
    o.start(t); o.stop(t + 0.5);
  }

  // cano velho arrebentando: metal cedendo e depois agua com pressao
  pipeBurst(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 8;
    f.frequency.setValueAtTime(1600, t);
    f.frequency.exponentialRampToValueAtTime(420, t + 0.25);
    s.connect(f);
    const g = this._env(f, t, 0.002, 0.3, 0.4 * vol);
    g.connect(this.verb);
    s.start(t, Math.random() * 3, 0.5); s.stop(t + 0.5);
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(50, t + 0.2);
    this._env(o, t, 0.001, 0.25, 0.4 * vol);
    o.start(t); o.stop(t + 0.35);
    // jato de agua depois
    const j = c.createBufferSource();
    j.buffer = this.noiseBuf;
    const jf = c.createBiquadFilter();
    jf.type = 'highpass'; jf.frequency.value = 2200;
    j.connect(jf);
    this._env(jf, t + 0.1, 0.15, 1.4, 0.13 * vol);
    j.start(t + 0.1, Math.random() * 2, 1.8); j.stop(t + 1.8);
  }

  // esforco: puxar, forcar, arrebentar
  strain(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.35;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 12;
    f.frequency.setValueAtTime(420 + Math.random() * 200, t);
    f.frequency.linearRampToValueAtTime(700, t + 0.3);
    s.connect(f);
    this._env(f, t, 0.03, 0.34, 0.13 * vol);
    s.start(t, Math.random() * 2, 0.5); s.stop(t + 0.5);
  }

  // ---------------- Capitulo 2 ----------------

  // Ripa de palete acertando um corpo. E mais SECO e mais grave que o soco:
  // madeira nao estala como osso, ela bate e para.
  clubHit(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(34, t + 0.15);
    this._env(o, t, 0.001, 0.2, 0.55 * vol);
    o.start(t); o.stop(t + 0.25);
    // o estalo curto da madeira por cima
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 3; f.frequency.value = 900 + Math.random() * 400;
    s.connect(f);
    const g = this._env(f, t, 0.001, 0.07, 0.34 * vol);
    g.connect(this.verb);
    s.start(t, Math.random() * 3, 0.2); s.stop(t + 0.2);
  }

  // A ripa se partindo. Dois estalos, o segundo mais grave: e assim que
  // madeira racha — nunca de uma vez.
  clubBreak(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    for (const [dt, fq, pk] of [[0, 1700, 0.32], [0.05, 760, 0.4]]) {
      const s = c.createBufferSource();
      s.buffer = this.noiseBuf;
      const f = c.createBiquadFilter();
      f.type = 'bandpass'; f.Q.value = 6; f.frequency.value = fq;
      s.connect(f);
      const g = this._env(f, t + dt, 0.001, 0.13, pk * vol);
      g.connect(this.verb);
      s.start(t + dt, Math.random() * 3, 0.25); s.stop(t + dt + 0.25);
    }
  }

  // Telefone velho de campainha. Duas badaladas curtas, marteladas contra o
  // sino — e o som que o Ecoador traz consigo, e ele nao devia existir.
  phoneRing(vol = 1, longe = 0) {
    if (!this.ensure()) return;
    const c = this.ctx, t0 = c.currentTime;
    const corte = c.createBiquadFilter();
    corte.type = 'lowpass';
    corte.frequency.value = 5200 - longe * 4000;   // longe = abafado
    corte.connect(this.busSfx);
    const eco = c.createGain(); eco.gain.value = 0.5 + longe * 0.6;
    corte.connect(eco); eco.connect(this.verb);
    for (let r = 0; r < 2; r++) {
      const base = t0 + r * 0.42;
      for (let i = 0; i < 9; i++) {
        const t = base + i * 0.024;
        for (const fq of [1080, 1330]) {
          const o = c.createOscillator();
          o.type = 'sine';
          o.frequency.value = fq * (1 + (Math.random() - 0.5) * 0.01);
          const g = c.createGain();
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.09 * vol, t + 0.004);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
          o.connect(g); g.connect(corte);
          o.start(t); o.stop(t + 0.16);
        }
      }
    }
  }

  // Cochicho: nao e palavra nenhuma, e ruido de banda estreita passeando na
  // faixa da voz humana. A cabeca do jogador completa o resto sozinha.
  whisper(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 0.7 + Math.random() * 0.5;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 9;
    const f0 = 700 + Math.random() * 900;
    f.frequency.setValueAtTime(f0, t);
    f.frequency.linearRampToValueAtTime(f0 * (0.6 + Math.random() * 0.8), t + 0.8);
    s.connect(f);
    const g = this._env(f, t, 0.18, 0.9, 0.075 * vol);
    g.connect(this.verb);
    s.start(t, Math.random() * 3, 1.3); s.stop(t + 1.3);
  }

  // Caneta no papel. Rabiscos curtos e irregulares — som de mao escrevendo,
  // nao de maquina de escrever.
  writing(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 2.4 + Math.random();
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 2.4;
    f.frequency.value = 2600 + Math.random() * 1600;
    s.connect(f);
    this._env(f, t, 0.006, 0.05 + Math.random() * 0.05, 0.05 * vol);
    s.start(t, Math.random() * 3, 0.14); s.stop(t + 0.14);
  }

  pageTurn(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 1.6;
    const f = c.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = 1800;
    s.connect(f);
    this._env(f, t, 0.02, 0.16, 0.09 * vol);
    s.start(t, Math.random() * 3, 0.25); s.stop(t + 0.25);
  }

  // Todas as maquinas ligando ao mesmo tempo. Um baque de partida, e um
  // zumbido que fica. E o preco da pistola.
  machineStart(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(24, t);
    o.frequency.exponentialRampToValueAtTime(58, t + 1.2);
    const f = c.createBiquadFilter();
    f.type = 'lowpass'; f.frequency.value = 320;
    o.connect(f);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.28 * vol, t + 0.5);
    g.gain.setValueAtTime(0.28 * vol, t + 2.2);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 3.6);
    f.connect(g); g.connect(this.busSfx);
    o.start(t); o.stop(t + 3.8);
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const sf = c.createBiquadFilter();
    sf.type = 'lowpass'; sf.frequency.value = 1100;
    s.connect(sf);
    const sg = this._env(sf, t, 0.01, 0.9, 0.3 * vol);
    sg.connect(this.verb);
    s.start(t, Math.random() * 2, 1.2); s.stop(t + 1.2);
  }

  // Cano de metal raspando o chao. O jogador precisa ouvir isto ANTES de
  // ver o Credor — e a regra de ouro da perseguicao.
  dragMetal(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = 1.1;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 5;
    f.frequency.setValueAtTime(1300 + Math.random() * 500, t);
    f.frequency.linearRampToValueAtTime(2400, t + 0.4);
    s.connect(f);
    const g = this._env(f, t, 0.06, 0.5, 0.14 * vol);
    g.connect(this.verb);
    s.start(t, Math.random() * 3, 0.7); s.stop(t + 0.7);
  }

  // Porta de armario de vestiario. E o som de ser PROCURADO.
  lockerBang(vol = 1) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = 2; f.frequency.value = 520;
    s.connect(f);
    const g = this._env(f, t, 0.001, 0.32, 0.4 * vol);
    g.connect(this.verb);
    s.start(t, Math.random() * 3, 0.5); s.stop(t + 0.5);
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(70, t + 0.2);
    this._env(o, t, 0.001, 0.24, 0.22 * vol);
    o.start(t); o.stop(t + 0.3);
  }

  // Respiracao. `presa` sobe o filtro e encurta tudo: e o ar saindo pelo
  // nariz de quem esta com a boca fechada e nao pode fazer barulho.
  breath(vol = 1, presa = false) {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const s = c.createBufferSource();
    s.buffer = this.noiseBuf;
    s.playbackRate.value = presa ? 1.4 : 0.9;
    const f = c.createBiquadFilter();
    f.type = 'bandpass'; f.Q.value = presa ? 6 : 2.2;
    f.frequency.value = presa ? 900 : 520;
    s.connect(f);
    this._env(f, t, presa ? 0.05 : 0.14, presa ? 0.18 : 0.5, 0.1 * vol);
    s.start(t, Math.random() * 3, 0.8); s.stop(t + 0.8);
  }

  uiMove() {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();
    o.type = 'triangle';
    o.frequency.setValueAtTime(520, t);
    o.frequency.exponentialRampToValueAtTime(380, t + 0.06);
    this._env(o, t, 0.002, 0.07, 0.10);
    o.start(t); o.stop(t + 0.1);
  }

  uiConfirm() {
    if (!this.ensure()) return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator();

// Interpolacao entre poses-chave.
//
// `ease: 'linear'` importa mais do que parece. Suavizar a entrada E a saida
// de CADA pose faz o membro desacelerar em todo quadro-chave, e o resultado
// e aquele balanco mole de boneco de pano. Andar, correr e socar usam
// interpolacao reta: o movimento tem direcao e para onde o animador mandou,
// nao onde a curva deixou. So parado e fumando usam curva suave.
function sampleAnim(anim, tn, out) {
  const keys = anim.keys;
  let i = 0;
  while (i < keys.length - 2 && keys[i + 1].t <= tn) i++;
  const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
  const span = Math.max(1e-6, b.t - a.t);
  let k = clamp((tn - a.t) / span, 0, 1);
  if (anim.ease !== 'linear') k = easeInOut(k);
  for (const f of FIELDS) out[f] = lerp(a.p[f], b.p[f], k);
  return out;
}

const BW = 120, BH = 120, ORX = 60, ORY = 100;

class Detective {
  constructor() {
    if (!P.head) buildParts();
    this.buf = makeBuffer(BW, BH);
    this.rimBuf = makeBuffer(BW, BH);
    // Buffer proprio para o tingimento. Sem ele, tingir e ter contorno de
    // luz brigariam pelo mesmo buffer e um apagava o outro — e os inimigos
    // ficavam sem a casquinha de luz que os separa do escuro.
    this.tintBuf = null;
    this.anim = 'idle';
    this.time = 0;
    this.speed = 1;
    this.facing = 1;
    this.flipT = 1;          // 1 = estavel; cai para 0 no meio da virada
    this.pose = Object.assign({}, REST);
    this.blendFrom = null;
    this.blendT = 0;
    this.blendDur = 0.14;
    this.done = false;
    this.onEvent = null;
    // club/pipe ficam de fora do _clearProps: uma arma na mao nao pode
    // sumir so porque a animacao mudou.
    this.props = { cig: 'none', lighter: 'none', flame: 0, gun: 'holstered', club: 'none', pipe: 'none' };
    // Mira: sobrescreve os angulos do braco da frente depois da animacao.
    // Nao da para keyframar isto — o angulo vem do mouse do jogador.
    this.aim = { on: false, angle: 0, recoil: 0 };
    this.muzzleT = 0;
    this._muzzleLocal = null;
    this.rimColor = '#7fa5d8';
    this.rimDX = -1; this.rimDY = -1;
    // 0.55 deixava um contorno azul em volta do corpo inteiro e ele parecia
    // vestido de neon. O contorno tem que sugerir a luz, nao desenhar o
    // personagem.
    this.rimAlpha = 0.30;
    this.reflect = 0;
    this.alpha = 1;
    this.skirt = 0;      // inclinacao da aba do sobretudo (segue o corpo com atraso)
    this._firedIdx = -1;
    this._lightLocal = null;
    this._cigWorld = null;
    this.visible = true;
    this.showSkeleton = false;
    // Silhueta: se tiver cor, o corpo inteiro e pintado com ela e a luz de
    // contorno some. E assim que a figura negra e feita — o mesmo boneco
    // articulado, sem nenhuma informacao dentro.
    this.silhouette = null;
    // Troca de peças. Uma criatura só declara o que muda nela; tudo que
    // faltar cai nas peças do detetive. Peça declarada como `null` não é
    // desenhada — é assim que os inimigos ficam sem gola, sem aba de
    // sobretudo e sem coldre.
    this.parts = null;
    // Recolorir o boneco inteiro: e assim que os NPCs e os Sem-Rosto usam o
    // mesmo esqueleto sem virarem clones do detetive.
    this.tint = null;
    this.tintK = 0.72;
    // Rosto alisado, sem tra o nenhum.
    this.faceless = false;
    this.scaleX = 1;
    this.scaleY = 1;
  }

  // Peça `n`, respeitando a troca da criatura.
  _p(n) {
    if (this.parts && Object.prototype.hasOwnProperty.call(this.parts, n)) return this.parts[n];
    return P[n];
  }

  play(name, opts = {}) {
    if (this.anim === name && !opts.restart) return;
    if (!ANIM[name]) return;
    this.blendFrom = Object.assign({}, this.pose);
    this.blendT = 0;
    this.blendDur = opts.blend === undefined ? 0.14 : opts.blend;
    this.anim = name;
    this.time = 0;
    this.done = false;
    this._firedIdx = -1;
    if (name !== 'smoke') this._clearProps();
  }

  _clearProps() {
    this.props.cig = 'none';
    this.props.lighter = 'none';

  lights.push({ x: DOOR_X - 24, y: dr.y - 38, r: 58, color: PAL.neonRed, i: 0.42, flick: 'neon' });

  // fim do beco: parede transversal e entulho
  rect(g, 1230, WALL_TOP, W - 1230, GY - WALL_TOP, '#1a1512');
  M.brickWall(g, 1230, WALL_TOP, W - 1230, GY - WALL_TOP, 231, { base: '#2c221f', hi: '#3a2c28', dk: '#1e1715' });
  M.trashPile(g, 1240, GY, 241);
  M.crate(g, 1264, GY, 1, 251);

  // Luz que vaza da boca do beco: o poste da rua fica fora da tela, a
  // esquerda. E a unica coisa que ilumina o inicio da fase.
  lights.push({ x: -34, y: 40, r: 300, color: PAL.lampWarm, i: 0.9, falloff: 1.25 });
  lights.push({ x: 40, y: GY - 40, r: 170, color: '#7d94c4', i: 0.34, falloff: 1.4 });
  // Janela acesa la em cima, no meio do beco. Serve de farol: o jogador
  // enxerga o caminho e sente que existe gente viva por perto.
  rect(g, 558, 38, 30, 24, '#241c18');
  rect(g, 560, 40, 26, 20, '#7a5f2c');
  rect(g, 561, 41, 24, 18, '#a07c3a');
  rect(g, 572, 40, 2, 20, '#241c18');
  rect(g, 560, 49, 26, 2, '#241c18');
  lights.push({ x: 573, y: 52, r: 96, color: '#e0b877', i: 0.55, falloff: 1.1 });

  // --- primeiro plano ---
  const fore = makeBuffer(Math.ceil(VW + (W - VW) * 1.18) + 8, VH);
  {
    const f = fore.x;
    // beirada do predio de cima, cortando o topo da tela
    rect(f, 0, 0, fore.c.width, 12, '#05070a');
    const rnd = mulberry32(4222);
    for (let x = 0; x < fore.c.width; x += 6) {
      rect(f, x, 12, 6, 1 + Math.floor(rnd() * 4), '#05070a');
    }
    // fios cruzando o beco
    for (let i = 0; i < 7; i++) {
      const bx = rnd() * fore.c.width;
      const sag = 10 + rnd() * 16;
      f.fillStyle = '#080a0d';
      for (let x = 0; x < 150; x++) {
        const t = x / 150;
        const y = 8 + Math.sin(t * Math.PI) * sag;
        f.fillRect(Math.round(bx + x), Math.round(y), 1, 1);
      }
    }
    // cano preto em primeiro plano na entrada
    rect(f, 40, 0, 7, VH, '#06080b');
    rect(f, 40, 0, 1, VH, '#0e1116');
  }

  return new Level({
    key: 'alley',
    nameKey: 'loc_alley',
    width: W, groundY: GY,
    ambient: '#313d54',
    layers: [
      { c: sky.c, par: 0.14 },
      { c: mid.c, par: 0.42 },
      { c: main.c, par: 1 },
    ],
    fores: [{ c: fore.c, par: 1.18 }],
    lightDefs: lights,
    interactables: inter,
    weather: 'rain',
    rainIntensity: 1,
    reflect: 0.13,
    ambience: [{ n: 'rain', g: 0.22 }, { n: 'wind', g: 0.04 }],
    randomSfx: [{ fn: 'thunder', min: 26, max: 70, vol: 0.5 }],
    minX: 24, maxX: W - 40,
    spawn: { x: 90, facing: 1 },
    doorX: DOOR_X + 13,
    bloom: 0.55,
    enterBarks: ['bark_alley_enter'],
    barks: [
      { x: 210, key: 'bark_alley_rain', range: 46 },
      { x: 470, key: 'bark_joke_3', range: 44 },
      { x: 600, key: 'bark_alley_window', range: 46 },
      { x: 830, key: 'bark_alley_lamp', range: 44 },
      { x: 1000, key: 'bark_joke_1', range: 46 },
      { x: 1130, key: 'bark_alley_door', range: 44 },
    ],
  });
}

// ---------------------------------------------------------------------------
// BAR — escuro, vazio, cadeiras empilhadas
// ---------------------------------------------------------------------------

function buildBar() {
  const W = 1000, GY = 214;

  const back = makeBuffer(Math.ceil(VW + (W - VW) * 0.55) + 8, VH);
  {
    const b = back.x;
    rect(b, 0, 0, back.c.width, VH, '#080a0e');
    // vao dos fundos, corredor que some no preto
    ditherV(b, 0, 60, back.c.width, 120, '#12161d', '#07090c', 6);
  }

  const main = makeBuffer(W, VH);
  const g = main.x;

  // --- estrutura da parede: teto, gesso encardido, lambri, rodape ---
  const CEIL = 28, WAINSCOT = 118;

  // gesso encardido de fumaca de cigarro (o bar fumou por decadas)
  ditherV(g, 0, CEIL, W, WAINSCOT - CEIL, '#4a3d2c', '#382c1f', 6);
  grainRect(g, 0, CEIL, W, WAINSCOT - CEIL, ['#2a2016', '#54452f', '#1e1710'], 0.06, 1211);
  // manchas de infiltracao descendo do teto
  {
    const rnd = mulberry32(1215);
    for (let i = 0; i < 26; i++) {
      const sx = rnd() * W, sh = 14 + rnd() * 44;
      g.globalAlpha = 0.10 + rnd() * 0.14;
      rect(g, sx, CEIL, 2 + rnd() * 5, sh, '#140e08');
      g.globalAlpha = 1;
    }
  }

  // lambri de madeira
  M.woodPanel(g, 0, WAINSCOT, W, GY - WAINSCOT, 1201, { hi: '#5c4229', mid: '#43301e', dk: '#2a1c11' });
  rect(g, 0, WAINSCOT - 4, W, 4, '#6a4b2c');
  rect(g, 0, WAINSCOT - 4, W, 1, '#8a6238');
  rect(g, 0, WAINSCOT, W, 1, '#20140b');
  // rodape
  rect(g, 0, GY - 7, W, 7, '#4e3720');
  rect(g, 0, GY - 7, W, 1, '#6d4d2c');

  // teto de chapa estampada
  rect(g, 0, 0, W, CEIL, '#221a14');
  for (let x = 0; x < W; x += 16) {
    rect(g, x, 4, 1, CEIL - 6, '#2e2419');
    rect(g, x + 8, 4, 14, 1, '#2e2419');
    rect(g, x + 8, 16, 14, 1, '#2e2419');
  }
  rect(g, 0, CEIL - 3, W, 3, '#160f0a');
  rect(g, 0, CEIL - 4, W, 1, '#332619');
  grainRect(g, 0, 0, W, CEIL, ['#160f0a', '#3a2c1c'], 0.06, 1221);

  // piso de tabua
  M.woodPanel(g, 0, GY, W, VH - GY, 1231, { pw: 26, hi: '#4c3623', mid: '#382718', dk: '#21160e' });
  for (let x = 0; x < W; x += 26) rect(g, x, GY, 1, VH - GY, '#180f08');
  rect(g, 0, GY, W, 1, '#120b06');
  grainRect(g, 0, GY, W, VH - GY, ['#241809', '#42301e'], 0.06, 1241);

  const inter = [];
  const lights = [];

  // porta de saida (volta para o beco)
  const ex = M.doorFrame(g, 44, GY, 1251);
  inter.push({
    x: ex.x, y: ex.y, w: ex.w, h: ex.h, prompt: 'prompt_open',
    action: 'exit_bar', range: 30, isDoor: true,
  });

  // janela com persiana — a unica luz "natural"
  M.windowBlinds(g, 150, 52, 56, 50);
  lights.push({ x: 178, y: 78, r: 150, color: '#8fb4e8', i: 0.46, falloff: 1.25 });
  lights.push({ x: 178, y: 78, r: 34, color: '#c6dcff', i: 0.5 });

  // quadros tortos e uma placa de cerveja apagada
  rect(g, 250, 60, 34, 26, '#2c1e12');
  rect(g, 252, 62, 30, 22, '#4a3a26');
  rect(g, 256, 66, 22, 14, '#5e4c33');
  rect(g, 700, 56, 44, 20, '#241a12');
  rect(g, 702, 58, 40, 16, '#3d2f1e');
  rect(g, 706, 62, 32, 8, '#5c3a2a');
  rect(g, 300, 66, 26, 20, '#2c1e12');
  rect(g, 302, 68, 22, 16, '#453524');

  // mesas com cadeiras empilhadas
  const t1 = M.table(g, 258, GY, 46, 1261);
  M.chairStack(g, 268, t1.y - 3, 3, 1271);
  inter.push({ x: 258, y: t1.y - 30, w: 46, h: 50, prompt: 'prompt_look', lines: 'bar_chairs', range: 30 });

  const t2 = M.table(g, 372, GY, 42, 1281);
  M.chairStack(g, 380, t2.y - 3, 4, 1291);

  const t3 = M.table(g, 862, GY, 44, 1301);
  M.chairStack(g, 870, t3.y - 3, 2, 1311);
  M.chair(g, 920, GY, false, 1321);

  // balcao
  M.barCounter(g, 520, GY, 232, 1331);
  inter.push({ x: 560, y: GY - 30, w: 60, h: 30, prompt: 'prompt_look', lines: 'bar_counter', range: 30 });

  // prateleira e espelho atras
  M.crackedMirror(g, 596, 108, 92, 44, 1341);
  inter.push({ x: 596, y: 108, w: 92, h: 44, prompt: 'prompt_look', lines: 'bar_mirror', range: 30 });
  M.bottleShelf(g, 540, 140, 200, 1351);
  M.bottleShelf(g, 540, 116, 60, 1361);
  rect(g, 528, 156, 216, 2, '#2e2118');

  // telefone de parede com fio cortado
  M.wallPhone(g, 806, 120, 1371);
  inter.push({ x: 800, y: 118, w: 20, h: 26, prompt: 'prompt_look', lines: 'bar_phone', range: 26 });

  // --- o estrago ---
  // O bar nao esta so fechado: alguem passou por aqui quebrando coisa. E o
  // detalhe que conta a historia e que as cadeiras continuam empilhadas no
  // meio disso.
  M.wallHole(g, 330, 138, 34, 46, 1381);
  M.wallHole(g, 690, 150, 22, 34, 1391);
  M.debris(g, 322, GY, 52, 1401);
  M.debris(g, 676, GY, 44, 1411);
  M.debris(g, 470, GY, 40, 1421);
  M.brokenChair(g, 214, GY, 1431);
  M.brokenChair(g, 500, GY, 1441);
  M.brokenChair(g, 744, GY, 1451);
  M.glassShards(g, 520, GY, 240, 1461);
  M.glassShards(g, 330, GY, 60, 1471);
  // prateleira de garrafas desabada de um lado
  rect(g, 540, 158, 68, 3, '#2e2118');
  for (let i = 0; i < 9; i++) {
    rect(g, 545 + i * 7, 152 + (i % 3), 3, 6, ['#2b4a3a', '#4a3a1e', '#3a2030'][i % 3]);
  }
  M.glassShards(g, 545, 176, 70, 1481);
  // papel de parede rasgado pendurado
  for (const [px, ph] of [[262, 22], [612, 18], [842, 26]]) {
    rect(g, px, 100, 7, ph, '#1d150e');
    rect(g, px + 1, 100, 5, ph - 3, '#4a3a26');
    rect(g, px + 2, 100 + ph - 4, 3, 4, '#3a2c1c');
  }
  inter.push({ x: 330, y: 138, w: 34, h: 46, prompt: 'prompt_look', lines: 'bar_wreck', range: 32 });

  // --- a trilha de sangue ---
  // Comeca fraca perto do balcao e vai ficando mais junta ate a porta dos
  // fundos. O jogador segue sem precisar de seta na tela.
  M.bloodDrops(g, 600, GY, 120, 9, 1501);
  M.bloodDrops(g, 700, GY, 110, 14, 1511);
  M.bloodDrops(g, 790, GY, 100, 20, 1521);
  M.bloodDrops(g, 870, GY, 70, 26, 1531);

  const bd = M.doorFrame(g, 930, GY, 1541);
  inter.push({
    x: bd.x, y: bd.y, w: bd.w, h: bd.h, prompt: 'prompt_open',
    action: 'enter_back', range: 30, isDoor: true,
  });
  rect(g, 924, GY, 38, 3, '#241811');
  const bdb = M.bareBulb(g, 943, bd.y - 18, 10);
  lights.push({ x: bdb.bulbX, y: bdb.bulbY, r: 64, color: '#e8b46a', i: 0.5, flick: 'bulb' });

  const lampGlow = { x: 430, y: 52, r: 210, color: '#e8b46a', i: 1.15, flick: 'swing', falloff: 0.8 };
  const lampCore = { x: 430, y: 52, r: 30, color: '#ffdca8', i: 1.0, flick: 'swing' };
  lights.push(lampGlow, lampCore);
  // luz batendo no assoalho embaixo de cada pendente
  lights.push({ x: 430, y: GY + 4, r: 140, color: '#c08a4e', i: 0.42, flick: 'swing', falloff: 1.3 });
  lights.push({ x: 660, y: GY + 4, r: 120, color: '#b07f48', i: 0.32, falloff: 1.3 });
  // segunda pendente, mais fraca, sobre o balcao
  lights.push({ x: 660, y: 60, r: 160, color: '#dba765', i: 0.75, falloff: 0.9 });
  lights.push({ x: 660, y: 60, r: 20, color: '#ffdca8', i: 0.8 });
  rect(g, 660, 0, 1, 44, '#0e0b08');
  rect(g, 653, 44, 15, 3, '#20252b');
  rect(g, 655, 47, 11, 3, '#20252b');
  rect(g, 657, 50, 7, 3, '#e8c88a');
  // luz vermelha de saida perto da porta
  lights.push({ x: 60, y: 150, r: 74, color: '#8c3226', i: 0.3 });

  const fore = makeBuffer(Math.ceil(VW + (W - VW) * 1.25) + 8, VH);
  {
    const f = fore.x;
    rect(f, 0, 0, fore.c.width, 8, '#040506');
    // mesa cortada em primeiro plano, bem escura
    rect(f, 120, VH - 42, 90, 6, '#0a0705');
    rect(f, 132, VH - 36, 5, 36, '#0a0705');
    rect(f, 194, VH - 36, 5, 36, '#0a0705');
    rect(f, 640, VH - 30, 120, 30, '#070504');
  }

  const lvl = new Level({
    key: 'bar',
    nameKey: 'loc_bar',
    width: W, groundY: GY,
    ambient: '#2b3648',
    layers: [
      { c: back.c, par: 0.55 },
      { c: main.c, par: 1 },
    ],
    fores: [{ c: fore.c, par: 1.25 }],
    lightDefs: lights,
    interactables: inter,
    weather: 'none',
    reflect: 0.07,
    minX: 24, maxX: W - 40,
    spawn: { x: 74, facing: 1 },
    doorX: 57,
    bloom: 0.42,
    indoor: true,
    // chuva so no que vaza pela porta da frente, bem abafada
    ambience: [{ n: 'roomtone', g: 0.10 }, { n: 'rain', g: 0.035 }],
    randomSfx: [{ fn: 'drip', min: 6, max: 15, vol: 0.6 }],
    enterBarks: ['bark_bar_enter', 'bark_bar_enter2'],
    barks: [
      { x: 200, key: 'bark_bar_dark', range: 44 },
      { x: 340, key: ['bark_bar_wreck', 'bark_bar_wreck2'], range: 46 },
      { x: 430, key: 'bark_bar_chairs', range: 40 },
      { x: 560, key: 'bark_bar_bottles', range: 44 },
      { x: 640, key: ['bark_blood', 'bark_blood2'], range: 46 },
      { x: 780, key: 'bark_bar_chairs2', range: 44 },
      { x: 900, key: 'bark_back_door', range: 48 },
    ],
  });

  // lampada balancando: move a luz E o sprite, entao a sombra da sala anda
  lvl.lampSwing = 0;
  lvl.onUpdate = (dt, t) => {
    const a = Math.sin(t * 0.9) * 7 + Math.sin(t * 0.37) * 3;
    lvl.lampSwing = a;
    lampGlow.x = lampCore.x = 430 + a;
    lampGlow.y = lampCore.y = 52 + Math.abs(a) * 0.12;
  };
  lvl.drawProps = (ctx, cam) => {
    // corpo da lampada, desenhado por frame porque balanca
    const ax = 430 - cam.ix;                    // ponto fixo no teto
    const bx = 430 + lvl.lampSwing - cam.ix;    // ponta do fio
    const y = Math.round(44 - cam.iy);
    ctx.fillStyle = '#0e0b08';
    for (let i = 0; i <= 44; i++) {
      const t = i / 44;
      ctx.fillRect(Math.round(ax + (bx - ax) * t), Math.round(-cam.iy + i), 1, 1);
    }
    const x = Math.round(bx);
    ctx.fillStyle = '#20252b';
    ctx.fillRect(x - 7, y, 15, 3);
    ctx.fillRect(x - 5, y + 3, 11, 3);
    ctx.fillStyle = '#e8c88a';
    ctx.fillRect(x - 3, y + 6, 7, 3);
    ctx.fillStyle = '#fff0c8';
    ctx.fillRect(x - 2, y + 9, 5, 1);
  };

  return lvl;
}

function buildBackroom() {
  const W = 520, GY = 214;

  const main = makeBuffer(W, VH);
  const g = main.x;

  // paredes de bloco, sem acabamento
  rect(g, 0, 0, W, GY, '#1a1815');
  M.brickWall(g, 0, 20, W, GY - 20, 2101, {
    base: '#3a352e', hi: '#464036', dk: '#2a251f', mortar: '#1e1a16', moss: false,
  });
  for (let i = 0; i < 50; i++) {
    g.globalAlpha = 0.7 * (1 - i / 50);
    rect(g, 0, 20 + i, W, 1, '#050403');
  }
  g.globalAlpha = 1;
  rect(g, 0, 0, W, 20, '#0a0908');

  // piso de cimento
  M.asphalt(g, 0, GY, W, VH - GY, 2111, { hi: '#3a352e', mid: '#2b2721', dk: '#1c1915' });

  const inter = [];
  const lights = [];

    x: ex.x, y: ex.y, w: ex.w, h: ex.h, prompt: 'prompt_open',

      rect(g, px, 120 + i * 26, 62, 3, '#3a2a1c');

  M.debris(g, 200, GY, 40, 2161);

  // --- a trilha, cada vez mais junta ate parar ---
  M.bloodDrops(g, 80, GY, 90, 10, 2171);
  M.bloodDrops(g, 160, GY, 90, 16, 2181);
  M.bloodDrops(g, 240, GY, 90, 24, 2191);
  M.bloodDrops(g, 320, GY, 50, 30, 2201);
  M.bloodPool(g, 356, GY, 44, 2211);
  const nt = M.note(g, 378, GY);
  inter.push({
    x: nt.x - 6, y: nt.y - 10, w: nt.w + 12, h: 20,

  // uma lampada ruim, bem em cima da poca
  const bulb = M.bareBulb(g, 382, 24, 54);
  lights.push({ x: bulb.bulbX, y: bulb.bulbY, r: 170, color: '#e0b070', i: 1.0, flick: 'bulb', falloff: 0.85 });
  lights.push({ x: bulb.bulbX, y: bulb.bulbY, r: 24, color: '#fff0c8', i: 1.0, flick: 'bulb' });
  lights.push({ x: 378, y: 196, r: 92, color: '#c08a58', i: 0.42, falloff: 1.2 });
  // resto que escapa da porta do bar
  lights.push({ x: 58, y: 170, r: 74, color: '#e8b46a', i: 0.34, falloff: 1.2 });

  const fore = makeBuffer(Math.ceil(VW + (W - VW) * 1.2) + 8, VH);
  rect(fore.x, 0, 0, fore.c.width, 10, '#040302');
  rect(fore.x, 0, VH - 8, fore.c.width, 8, '#040302');

  return new Level({
    key: 'backroom',
    nameKey: 'loc_back',
    width: W, groundY: GY,

// ---------------------------------------------------------------------------
// GALPAO — onde ele acorda algemado
// ---------------------------------------------------------------------------

function buildWarehouse() {
  const W = 760, GY = 214;

  const back = makeBuffer(Math.ceil(VW + (W - VW) * 0.5) + 8, VH);
  {
    const b = back.x;
    rect(b, 0, 0, back.c.width, VH, '#0a0c0f');
    // vigas do teto la no fundo, sumindo no escuro
    for (let x = 20; x < back.c.width; x += 96) {
      rect(b, x, 14, 4, 70, '#14171c');
      rect(b, x - 30, 14, 64, 3, '#171a20');
    }
    ditherV(b, 0, 84, back.c.width, 60, '#101317', '#08090c', 5);
  }

  const main = makeBuffer(W, VH);
  const g = main.x;

  rect(g, 0, 0, W, VH, '#131211');
  // chapa ondulada ate a metade, alvenaria embaixo
  M.metalPanel(g, 0, 0, W, 120, 3101, { hi: '#3a4048', mid: '#2b3037', dk: '#1a1e23' });
  M.brickWall(g, 0, 120, W, GY - 120, 3111, {
    base: '#332f2a', hi: '#3d3831', dk: '#252220', mortar: '#1a1816', moss: false,
  });
  for (let i = 0; i < 44; i++) {
    g.globalAlpha = 0.6 * (1 - i / 44);
    rect(g, 0, i, W, 1, '#040506');
    g.globalAlpha = 1;
  }

  rect(g, x + (w >> 1) - 9, gy - 32, 18, 3, '#2a3038');
  grainRect(g, x, y, w, h, [PAL.rust, '#1a1e24'], 0.05, seed);
}

// Relogio de ponto. Sempre 02h14.
function punchClock(g, x, y) {
  rect(g, x, y, 22, 26, '#2a2620');
  rect(g, x, y, 22, 1, '#3d372e');
  rect(g, x + 3, y + 3, 16, 16, '#cfc6b0');
  rect(g, x + 3, y + 3, 16, 1, '#8b8272');
  // ponteiros parados em 02h14
  rect(g, x + 10, y + 8, 1, 4, '#241c18');
  rect(g, x + 11, y + 11, 4, 1, '#241c18');
  rect(g, x + 10, y + 11, 2, 2, '#7a1c14');
  rect(g, x + 5, y + 21, 12, 3, '#1c1814');
}

// Armario de vestiario. Alguns abertos, e e sempre o aberto que interessa.
function locker(g, x, gy, n, seed, abertos = []) {
  const w = 20, h = 74;
  const y = gy - h;
  const rnd = mulberry32(seed);
  for (let i = 0; i < n; i++) {
    const lx = x + i * w;
    const aberto = abertos.indexOf(i) >= 0;
    rect(g, lx, y, w, h, '#39434e');
    rect(g, lx, y, w, 1, '#4c5866');
    rect(g, lx, y + h - 1, w, 1, '#20262e');
    rect(g, lx + w - 1, y, 1, h, '#232a32');
    if (aberto) {
      rect(g, lx + 2, y + 2, w - 4, h - 4, '#0b0e12');
      rect(g, lx + 2, y + 2, w - 4, 3, '#141a20');
      // porta escancarada para o lado
      rect(g, lx + w - 2, y + 4, 3, h - 8, '#414c58');
      rect(g, lx + w - 2, y + 4, 1, h - 8, '#556374');
    } else {
      // grelha de ventilacao
      for (let v = 0; v < 4; v++) rect(g, lx + 5, y + 8 + v * 3, 10, 1, '#232a32');
      rect(g, lx + w - 5, y + 34, 2, 5, '#8f959e');
      // etiqueta com nome
      rect(g, lx + 5, y + 46, 10, 5, '#b9b0a2');
      for (let c = 0; c < 3; c++) rect(g, lx + 6 + c * 3, y + 48, 2, 1, '#3a332c');
    }
    if (rnd() > 0.7) grainRect(g, lx, y, w, h, [PAL.rust, '#2b333c'], 0.05, seed + i);
  }
  return { x, y, w: n * w, h };
}

// Mesa de refeitorio de formica.
function canteenTable(g, x, gy, w, seed) {
  const y = gy - 30;
  rect(g, x, y, w, 4, '#9a9080');
  rect(g, x, y, w, 1, '#b6ac99');
  rect(g, x, y + 4, w, 2, '#4a443c');
  rect(g, x + 5, y + 6, 4, 24, '#3a4048');
  rect(g, x + w - 9, y + 6, 4, 24, '#3a4048');
  rect(g, x + 5, gy - 2, w - 10, 2, '#2a3038');
  grainRect(g, x, y, w, 6, ['#7f7668', '#aaa090'], 0.05, seed);
}

// Gancho de acougue pendurado no trilho do teto.
function meatHook(g, x, y, len) {
  rect(g, x, y, 1, len, '#5c626b');
  rect(g, x, y, 1, 2, '#7f858e');
  const b = y + len;
  rect(g, x - 1, b, 3, 2, '#6e747e');
  rect(g, x - 2, b + 2, 2, 3, '#6e747e');
  rect(g, x - 3, b + 5, 2, 2, '#5c626b');
  rect(g, x - 1, b + 6, 2, 1, '#4a5058');
}

// Caldeira / gerador morto.
function boiler(g, x, gy, w, h, seed) {
  const y = gy - h;
  rect(g, x, y, w, h, '#3d4149');
  rect(g, x, y, w, 3, '#4e535c');
  rect(g, x, gy - 4, w, 4, '#23262b');
  for (let i = 0; i < 3; i++) rect(g, x, y + 12 + i * Math.round(h / 4), w, 2, '#2b2f35');
  // painel e valvula
  rect(g, x + 6, y + 10, 14, 12, '#1b1e22');
  rect(g, x + 8, y + 12, 10, 8, '#5c4a1e');
  rect(g, x + w - 14, y + 16, 8, 8, '#6e747e');
  rect(g, x + w - 12, y + 18, 4, 4, '#3a4048');
  grainRect(g, x, y, w, h, [PAL.rust, '#23262b'], 0.07, seed);
}

// Tubulacao correndo pela parede.
function pipeRun(g, x, y, w, seed) {
  rect(g, x, y, w, 6, '#4a5058');
  rect(g, x, y, w, 2, '#616872');
  rect(g, x, y + 5, w, 1, '#2a3038');
  const rnd = mulberry32(seed);
  for (let i = 0; i < w; i += 40) {
    const fx = x + i + Math.floor(rnd() * 12);
    rect(g, fx, y - 1, 4, 8, '#565d66');
    rect(g, fx, y - 1, 1, 8, '#6e757f');
  }
  grainRect(g, x, y, w, 6, [PAL.rust, '#3a4048'], 0.08, seed + 3);
}

// Guarda-corpo do mezanino, desenhado no primeiro plano.
function railing(g, x, y, w) {
  rect(g, x, y, w, 2, '#4a5058');
  rect(g, x, y + 14, w, 1, '#3a4048');
  for (let i = 0; i < w; i += 26) rect(g, x + i, y, 2, 30, '#4a5058');
}

// Mesa telefonica antiga: plugue e cabo. Nenhum cabo termina em lugar
// nenhum, e e esse o detalhe que importa.
function switchboard(g, x, gy) {
  const h = 46, w = 52, y = gy - h;
  rect(g, x, y, w, h, '#3a2b1e');
  rect(g, x, y, w, 2, '#54402c');
  rect(g, x + 2, y + 4, w - 4, 24, '#1c1611');
  for (let r = 0; r < 3; r++) {
    for (let c = 0; c < 8; c++) {
      rect(g, x + 5 + c * 6, y + 7 + r * 7, 3, 3, '#0d0b09');
      rect(g, x + 5 + c * 6, y + 7 + r * 7, 3, 1, '#5c5248');
    }
  }
  // cabos pendurados
  for (const cx of [x + 10, x + 24, x + 38]) {
    for (let i = 0; i < 14; i++) rect(g, cx + Math.round(Math.sin(i * 0.5) * 2), y + 28 + i, 1, 1, '#241c18');
  }
  rect(g, x, gy - 4, w, 4, '#241a12');
}

// Porta pesada de camara fria.
function coldDoor(g, x, gy, seed) {
  const w = 40, h = 78, y = gy - h;
  rect(g, x - 3, y - 3, w + 6, h + 3, '#2a2f36');
  rect(g, x, y, w, h, '#525860');
  rect(g, x, y, w, 2, '#6b727c');
  rect(g, x, y + h - 3, w, 3, '#33383f');
  rect(g, x + 4, y + 6, w - 8, h - 14, '#464c54');
  rect(g, x + w - 12, y + 34, 9, 4, '#8f959e');
  rect(g, x + w - 12, y + 38, 3, 12, '#8f959e');
  grainRect(g, x, y, w, h, ['#6b727c', '#33383f'], 0.05, seed);
  return { x, y, w, h };
}

// Teto industrial: tesouras de aco sumindo no escuro. Vai na camada de
// fundo, com paralaxe — e o que da os tres andares de pe-direito.
function trusses(g, w, h) {
  rect(g, 0, 0, w, h, '#0a0c10');
  for (let x = -20; x < w; x += 118) {
    rect(g, x + 40, 10, 5, 74, '#151a20');
    rect(g, x, 10, 96, 4, '#181d24');
    rect(g, x, 30, 96, 3, '#141920');
    for (let i = 0; i < 5; i++) {
      const bx = x + 8 + i * 18;
      for (let j = 0; j < 20; j++) rect(g, bx + j, 13 + j, 1, 1, '#161b22');
    }
  }
  ditherV(g, 0, 84, w, 70, '#101419', '#07090c', 5);
}

// Parede padrao do galpao: chapa ondulada em cima, alvenaria embaixo, e a
// faixa de sombra colada no teto que faz o lugar parecer alto.
function warehouseWall(g, w, seed, opt = {}) {
  const corte = opt.corte === undefined ? 118 : opt.corte;
  rect(g, 0, 0, w, VH, '#131211');
  M.metalPanel(g, 0, 0, w, corte, seed, { hi: '#3a4048', mid: '#2b3037', dk: '#1a1e23' });
  M.brickWall(g, 0, corte, w, GY - corte, seed + 11, {
    base: '#332f2a', hi: '#3d3831', dk: '#252220', mortar: '#1a1816', moss: false,
  });
  for (let i = 0; i < 52; i++) {
    g.globalAlpha = 0.62 * (1 - i / 52);
    rect(g, 0, i, w, 1, '#040506');
  }
  g.globalAlpha = 1;
  M.asphalt(g, 0, GY, w, VH - GY, seed + 21, { hi: '#33302b', mid: '#26231f', dk: '#191714' });
  rect(g, 0, GY, w, 1, '#0a0908');
  grainRect(g, 0, corte, w, GY - corte, ['#191715', '#3d3831'], 0.05, seed + 31);
}

// Itens que somem quando pegos.
//
// Tudo o mais do cenario e pintado UMA VEZ na camada e depois so deslocado
// — e o que faz o jogo rodar a 60fps sem sprite sheet nenhuma. Mas item
// pego tem que sumir, e pixel pintado na camada nao some. Entao estes
// poucos objetos sao desenhados por quadro, e so enquanto ainda estao la.
//
// Isso importa mais do que parece: o capitulo inteiro e sobre coisas que
// aparecem exatamente onde ele precisa. Se elas continuassem no lugar
// depois de pegas, a piada morria na primeira.
function itensSoltos(lvl, defs) {
  lvl.pego = {};
  const antes = lvl.drawProps;
  lvl.drawProps = (ctx, cam) => {
    if (antes) antes(ctx, cam);
    for (const d of defs) {
      if (lvl.pego[d.id]) continue;
      d.draw(ctx, Math.round(d.x - cam.ix), Math.round(d.y - cam.iy));
    }
  };
}

// Manchas de umidade descendo pela parede.
function damp(g, xs, y) {
  for (const px of xs) {
    for (let i = 0; i < 70; i++) {
      g.globalAlpha = 0.09;
      rect(g, px + Math.sin(i * 0.3) * 2, y + i, 2, 1, '#0d0f12');
    }
  }
  g.globalAlpha = 1;
}

// Lampada de emergencia: a luz que sobrou num predio sem energia. Poucas,
// fracas, e sempre longe uma da outra.
function emergencyLamp(g, x, y) {
  rect(g, x, y, 14, 7, '#2a3038');
  rect(g, x, y, 14, 1, '#3d454f');
  rect(g, x + 2, y + 7, 4, 3, '#8a2e22');
  rect(g, x + 8, y + 7, 4, 3, '#8a2e22');
  rect(g, x + 6, y - 4, 2, 4, '#20252b');
}

// ---------------------------------------------------------------------------

function buildCorridor() {
  const W = 1700;

  const back = makeBuffer(Math.ceil(VW + (W - VW) * 0.45) + 8, VH);
  trusses(back.x, back.c.width, VH);

  const main = makeBuffer(W, VH);
  const g = main.x;
  warehouseWall(g, W, 5101);
  damp(g, [120, 470, 900, 1320, 1600], 122);

  const inter = [];
  const lights = [];

  // porta de onde ele veio: o cubiculo do Capitulo 1
  const volta = M.doorFrame(g, 48, GY, 5111);
  inter.push({
    x: volta.x, y: volta.y, w: volta.w, h: volta.h, prompt: 'prompt_open',
    action: 'goto', to: 'warehouse', tox: 470, tofacing: -1, range: 30, isDoor: true,
  });
  rect(g, 42, GY, 38, 3, '#2b2620');

  // Estantes ate o teto dos dois lados. Sao elas que dizem "isso e um
  // quarteirao" sem ninguem precisar falar.
  rack(g, 150, 40, 120, GY - 40, 5121);
  rack(g, 290, 40, 120, GY - 40, 5131);
  rack(g, 1380, 46, 110, GY - 46, 5141);
  rack(g, 1500, 46, 110, GY - 46, 5151);

  forklift(g, 430, GY, 5161);
  inter.push({ x: 430, y: GY - 46, w: 60, h: 46, prompt: 'prompt_look', lines: 'c2_forklift', range: 34 });

  // pilha de paletes — e daqui que sai o porrete
  for (let i = 0; i < 7; i++) {
    const py = GY - 6 - i * 7;
    rect(g, 560, py, 62, 5, '#4a3524');
    rect(g, 560, py, 62, 1, '#63482f');
    rect(g, 560, py + 5, 62, 1, '#2a1c11');
  }
  inter.push({ x: 560, y: GY - 52, w: 62, h: 52, prompt: 'prompt_look', lines: 'c2_pallets', range: 32 });

  punchClock(g, 700, 138);
  inter.push({ x: 696, y: 136, w: 26, h: 30, prompt: 'prompt_look', lines: 'c2_clock', range: 26 });

  // escada de metal para o escritorio suspenso
  const ESC = 860;
  rect(g, ESC, 96, 76, 5, '#3d434b');
  rect(g, ESC, 96, 76, 2, '#4f565f');
  for (let i = 0; i < 9; i++) {
    rect(g, ESC + 4 + i * 8, 101 + i * 12, 20, 3, '#3d434b');
    rect(g, ESC + 4 + i * 8, 101 + i * 12, 20, 1, '#525a64');
  }
  rect(g, ESC + 72, 96, 3, GY - 96, '#33383f');
  // caixa do escritorio suspenso, vista por fora
  rect(g, ESC - 6, 40, 130, 58, '#2b3037');
  rect(g, ESC - 6, 40, 130, 3, '#3d454f');
  rect(g, ESC + 4, 50, 46, 30, '#6a5a30');
  rect(g, ESC + 56, 50, 46, 30, '#6a5a30');
  rect(g, ESC + 4, 50, 46, 3, '#8d7a42');
  rect(g, ESC + 56, 50, 46, 3, '#8d7a42');
  lights.push({ x: ESC + 54, y: 66, r: 132, color: '#dfae64', i: 0.5, falloff: 1.15 });
  inter.push({
    x: ESC + 20, y: GY - 40, w: 40, h: 40, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_office', tox: 76, tofacing: 1, range: 34,
  });

  dockGate(g, 980, GY, 104, 5171);
  inter.push({
    x: 980, y: GY - 108, w: 104, h: 108, prompt: 'prompt_look',
    lines: 'c2_dockgate', range: 46, id: 'doca',
  });

  M.crate(g, 1140, GY, 1, 5181);
  M.crate(g, 1164, GY, 0, 5191);
  M.crate(g, 1146, GY - 17, 0, 5201);
  // porta do arquivo morto
  const dArq = M.doorFrame(g, 1180, GY, 5215);
  inter.push({
    x: dArq.x, y: dArq.y, w: dArq.w, h: dArq.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_arquivo', tox: 66, tofacing: 1, range: 30, isDoor: true,
  });
  rect(g, 1174, GY, 38, 3, '#2b2620');
  M.debris(g, 1250, GY, 44, 5211);
  M.puddle(g, 700, GY + 12, 70, 5221);
  M.puddle(g, 1290, GY + 16, 52, 5231);

  // correntes penduradas
  for (const cx of [330, 760, 1210, 1560]) {
    for (let i = 0; i < 34 + (cx % 26); i++) rect(g, cx + (i % 2), 14 + i * 2, 2, 1, '#2a2e33');
  }

  // A ripa de palete. Encostada numa coluna. Em pe.
  const COL = 1320;
  rect(g, COL, 30, 12, GY - 30, '#333941');
  rect(g, COL, 30, 3, GY - 30, '#454c56');
  rect(g, COL - 3, GY - 6, 18, 6, '#262b31');
  inter.push({
    x: COL + 10, y: GY - 46, w: 14, h: 46, prompt: 'prompt_take',
    action: 'take_club', range: 26, id: 'porrete',
  });

  // porta para o setor B
  const dB = M.doorFrame(g, 1640, GY, 5241);
  inter.push({
    x: dB.x, y: dB.y, w: dB.w, h: dB.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_shelves', tox: 70, tofacing: 1, range: 30, isDoor: true,
  });

  // ---- luz ----
  //
  // Esta e a licao do B-23, e ela custou duas sessoes: luz calibrada para
  // uma sala nao serve num corredor de mil e setecentos pixels. Se as
  // lampadas ficam a 450px uma da outra, o meio do caminho e preto e o
  // jogador perde o proprio corpo de vista — e o setor que existe para
  // MOSTRAR o tamanho do lugar vira o setor onde nao se ve nada.
  //
  // A regra que ficou: lampada forte a cada ~400px, mais um preenchimento
  // fraco a cada ~200px na altura do chao. O escuro continua sendo o tom,
  // mas o espaco fica legivel.
  for (const lx of [240, 690, 1180, 1620]) {
    emergencyLamp(g, lx, 58);
    lights.push({ x: lx + 7, y: 68, r: 210, color: '#c98a5e', i: 0.72, falloff: 1.1 });
    lights.push({ x: lx + 7, y: 68, r: 30, color: '#ffd8a8', i: 0.55 });
    lights.push({ x: lx + 7, y: 196, r: 140, color: '#a8804e', i: 0.3, falloff: 1.35 });
  }
  for (const lx of [90, 460, 900, 1120, 1400, 1560]) {
    lights.push({ x: lx, y: 168, r: 150, color: '#7d6a52', i: 0.26, falloff: 1.4 });
  }
  // claraboias: duas facas de luar cortando o corredor
  for (const sx of [520, 1420]) {
    rect(g, sx, 0, 70, 12, '#0b0d10');
    rect(g, sx + 4, 1, 62, 9, '#3d4d63');
    rect(g, sx + 22, 1, 3, 9, '#0b0d10');
    lights.push({ x: sx + 34, y: 8, r: 210, color: '#6f8ec4', i: 0.56, falloff: 1.3 });
    lights.push({ x: sx + 34, y: 196, r: 140, color: '#5c78a8', i: 0.3, falloff: 1.4 });
  }
  // resto de luz por baixo do portao da doca
  lights.push({ x: 1032, y: 212, r: 100, color: '#b8905c', i: 0.34, falloff: 1.3 });

  const fore = makeBuffer(Math.ceil(VW + (W - VW) * 1.14) + 8, VH);
  {
    const f = fore.x;
    rect(f, 0, 0, f.canvas.width, 14, '#030202');
    rect(f, 0, VH - 8, f.canvas.width, 8, '#030202');
    for (const px of [180, 620, 1120, 1680]) rect(f, px, 0, 9, VH, '#050607');
  }

  const lvl = new Level({
    key: 'ch2_corridor',
    nameKey: 'loc_corridor',
    width: W, groundY: GY,
    ambient: '#2a3242',
    layers: [{ c: back.c, par: 0.45 }, { c: main.c, par: 1 }],
    fores: [{ c: fore.c, par: 1.14 }],
    lightDefs: lights,
    interactables: inter,
    weather: 'none',
    reflect: 0.05,
    minX: 34, maxX: W - 40,
    spawn: { x: 96, facing: 1 },
    bloom: 0.42,
    indoor: true,
    ambience: [{ n: 'hall', g: 0.12 }, { n: 'wind', g: 0.02 }],
    randomSfx: [
      { fn: 'drip', min: 4, max: 11, vol: 0.8 },
      { fn: 'metalCreak', min: 12, max: 28, vol: 0.85 },
      { fn: 'distantThump', min: 24, max: 54, vol: 0.7 },
      { fn: 'chainRattle', min: 18, max: 44, vol: 0.5 },
    ],
    // O corredor e o caminho de volta o capitulo inteiro. Ele so ganha
    // inimigos depois que o jogador ja conheceu o lugar.
    spawnTipos: ['semrosto'],
    ritmo: 42,
    maxInimigos: 2,
    esconderijos: [606, 1150],
    enterBarks: ['b2_corr_1', 'b2_corr_2'],
    barks: [
      { x: 420, key: 'b2_corr_3', range: 60 },
      { x: 520, key: 'b2_corr_4', range: 50 },
      { x: 1000, key: 'b2_corr_5', range: 60 },
    ],
  });
  lvl.docaX = 1032;
  itensSoltos(lvl, [{
    id: 'porrete', x: COL + 14, y: GY - 44,
    draw: (ctx, x, y) => {
      ctx.fillStyle = PAL.wood; ctx.fillRect(x, y, 4, 44);
      ctx.fillStyle = PAL.woodHi; ctx.fillRect(x, y, 1, 44);
      ctx.fillStyle = '#8f959e'; ctx.fillRect(x + 1, y - 2, 1, 3);
    },
  }]);
  return lvl;
}

function buildOffice() {
  const W = 560;

  const back = makeBuffer(Math.ceil(VW + (W - VW) * 0.6) + 8, VH);
  {
    const b = back.x;
    rect(b, 0, 0, b.canvas.width, VH, '#080a0e');
    ditherV(b, 0, 40, b.canvas.width, 120, '#12161d', '#07090c', 6);
  }

  const main = makeBuffer(W, VH);
  const g = main.x;

  // sala envidracada: divisoria de madeira embaixo, vidro em cima
  rect(g, 0, 0, W, VH, '#1a1712');
  M.woodPanel(g, 0, 108, W, GY - 108, 5301, { hi: '#5c4229', mid: '#43301e', dk: '#2a1c11' });
  rect(g, 0, 104, W, 4, '#6a4b2c');
  rect(g, 0, 104, W, 1, '#8a6238');
  // gesso amarelado
  ditherV(g, 0, 26, W, 78, '#4a4232', '#38311f', 6);
  grainRect(g, 0, 26, W, 78, ['#2a2416', '#54492f', '#1e1a10'], 0.06, 5311);
  rect(g, 0, 0, W, 26, '#221c14');
  for (let x = 0; x < W; x += 18) rect(g, x, 4, 1, 20, '#2e2619');
  rect(g, 0, 24, W, 2, '#160f0a');
  // piso
  M.asphalt(g, 0, GY, W, VH - GY, 5321, { hi: '#3a352e', mid: '#2b2721', dk: '#1c1915' });
  rect(g, 0, GY, W, 1, '#0d0b09');

  const inter = [];
  const lights = [];

  // porta de volta para a escada
  const ex = M.doorFrame(g, 40, GY, 5331);
  inter.push({
    x: ex.x, y: ex.y, w: ex.w, h: ex.h, prompt: 'prompt_open',
    action: 'goto', to: 'ch2_corridor', tox: 900, tofacing: 1, range: 30, isDoor: true,
